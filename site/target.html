27255183588"}, {"id": "2113196550243688553", "text": "老马头发有点乱，我帮他梳一下😋", "chars": 15, "date": "2026-10-22", "time": "17:11", "ts": 1792660293, "views": 907, "likes": 9, "replies": 6, "media": true, "url": "https://x.com/FKFKFKFKFKTB/status/2113196550243688553"}, {"id": "2113204121767481372", "text": "不懂就问\n\n马克思主义是一种宗教吗？\n\n@grok", "chars": 25, "date": "2026-10-22", "time": "17:41", "ts": 1792662098, "views": 1598, "likes": 4, "replies": 3, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113204121767481372"}, {"id": "2113211381495546156", "text": "说个常识：\n\n认为南海能打起来的都是傻逼。", "chars": 21, "date": "2026-10-22", "time": "18:10", "ts": 1792663829, "views": 6274, "likes": 10, "replies": 7, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113211381495546156"}, {"id": "2113221906744942801", "text": "说个暴论：\n\n金正恩是个白虎\n\n😱😱😱", "chars": 19, "date": "2026-10-22", "time": "18:52", "ts": 1792666338, "views": 1881, "likes": 8, "replies": 8, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113221906744942801"}, {"id": "2113243557998022882", "text": "如果美俄和解，俄乌停战，\n\n那几十万人是不是白死了？", "chars": 26, "date": "2026-10-22", "time": "20:18", "ts": 1792671501, "views": 1415, "likes": 7, "replies": 12, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113243557998022882"}, {"id": "2113261622089384432", "text": "卧槽！！事大了！\n\n金正恩七天能瘦这么多？？\n\n吃了减脂餐还是打了司美格鲁肽？\n\n或者是将军已经死了，找的替身？\n\n😱😱😱", "chars": 61, "date": "2026-10-22", "time": "21:30", "ts": 1792675807, "views": 25069, "likes": 25, "replies": 6, "media": true, "url": "https://x.com/FKFKFKFKFKTB/status/2113261622089384432"}, {"id": "2113265342197743810", "text": "深圳APEC快要来了，仪式感满满", "chars": 16, "date": "2026-10-22", "time": "21:44", "ts": 1792676694, "views": 1355, "likes": 4, "replies": 9, "media": true, "url": "https://x.com/FKFKFKFKFKTB/status/2113265342197743810"}, {"id": "2113276449071534438", "text": "一个成年男性最多连续射几次？@grok", "chars": 19, "date": "2026-10-22", "time": "22:29", "ts": 1792679342, "views": 2879, "likes": 3, "replies": 3, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113276449071534438"}, {"id": "2113286302934425809", "text": "卧槽！！！事大了！\n\n西藏突发7.0级地震！！\n\n路都断了！很多房子也倒了！😱😱\n\n希望人们平安！🙏🏻🙏🏻", "chars": 53, "date": "2026-10-22", "time": "23:08", "ts": 1792681692, "views": 13484, "likes": 13, "replies": 5, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113286302934425809"}, {"id": "2113293956666761432", "text": "突发：\n\n金将军出恭！", "chars": 11, "date": "2026-10-22", "time": "23:38", "ts": 1792683517, "views": 2406, "likes": 13, "replies": 20, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113293956666761432"}, {"id": "2113454149463662693", "text": "卧槽！！朝鲜网络中断了！😱\n\n难道金将军真的出事了？！秘不发丧？\n\n1994年，金日成去世34小时后，朝鲜才正式公布死讯。\n\n2011年，金正日去世，朝鲜更是隐瞒了整整51个多小时！\n\n将军近期露面，又比之前瘦了几十斤，难道是用替身来隐瞒？？😱\n\n大的真要来了吗？😱😱😱", "chars": 135, "date": "2026-10-23", "time": "10:15", "ts": 1792721709, "views": 5617, "likes": 14, "replies": 2, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113454149463662693"}, {"id": "2113464100785385784", "text": "突发！！事大了！\n\n朝鲜时间11：54\n\n雪主昨晚又被将军干成小泡芙了😱\n\n我不得劲😭😭😭", "chars": 45, "date": "2026-10-23", "time": "10:54", "ts": 1792724082, "views": 1228, "likes": 4, "replies": 2, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113464100785385784"}, {"id": "2113485681402036664", "text": "好奇一个问题\n\n肛肠科医生是男同怎么办？", "chars": 20, "date": "2026-10-23", "time": "12:20", "ts": 1792729227, "views": 1756, "likes": 12, "replies": 10, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113485681402036664"}, {"id": "2113499035277684774", "text": "就算是将军也逃不过当爹的命！\n大权在握的金正日，也得偷偷带儿子去日本迪士尼；\n富可敌国的金正恩，也得老老实实陪着女儿买鞋！", "chars": 61, "date": "2026-10-23", "time": "13:13", "ts": 1792732411, "views": 1690, "likes": 3, "replies": 2, "media": true, "url": "https://x.com/FKFKFKFKFKTB/status/2113499035277684774"}, {"id": "2113505233141973199", "text": "卧槽！！！\n\n我有个台湾朋友刚刚告诉我\n\n南海最近有大事发生！\n\n真的要变天了😱😱", "chars": 41, "date": "2026-10-23", "ti : "2026-11-04", "time": "13:53", "ts": 1793771590, "views": 5284, "likes": 13, "replies": 11, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117857668895580621"}, {"id": "2117864872008667286", "text": "不懂就问\n\n既然公蟹的蟹膏是螃蟹的精液\n\n为什么没有人把人类的精液拿去煮\n\n会不会比螃蟹的更软糯Q弹？", "chars": 51, "date": "2026-11-04", "time": "14:21", "ts": 1793773308, "views": 5878, "likes": 36, "replies": 34, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117864872008667286"}, {"id": "2117881547609285109", "text": "不懂就问\n\n既然德克萨斯都能翻蓝\n\n朝鲜为什么不能翻蓝？", "chars": 28, "date": "2026-11-04", "time": "15:28", "ts": 1793777283, "views": 3341, "likes": 23, "replies": 13, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117881547609285109"}, {"id": "2117892336055443846", "text": "美国中期选举正在开票，感觉自己正在见证历史。\n\n1. 佐治亚州：诞生美国历史上首位非裔女性州长。\n\n2. 得克萨斯州：时隔32年首次实现政党轮替，同时选出该州首位拉丁裔女性州长。\n\n3. 佛罗里达州：选出美国历史上首位民选共和党非裔州长，双方仅相差约1.4个百分点，选情异常激烈。\n\n4. 新罕布什尔州：诞生美国历史上首位公开同性恋身份的男性联邦参议员。\n\n5. 新墨西哥州：诞生美国历史上首位原住民女性州长。\n\n这场选举，无论红蓝阵营，都创造了多个历史纪录。\n\n美国建国250年，竟然还有这么多历史性的第一次，确实令人感慨。\n\n尤其是德州变蓝，实在太特别了。", "chars": 280, "date": "2026-11-04", "time": "16:10", "ts": 1793779856, "views": 3196, "likes": 11, "replies": 5, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117892336055443846"}, {"id": "2117898474792374457", "text": "说句实话：\n\n我所知道的两周内上岸的有三个，首先是我和笨笨，都是14天，还有一位是10天内，但是我记不清他的ID了。\n\n我的路径主要是以追求热点和制造冲突为导向。无论纯文字还是图文，都需要输出我想让人讨论，甚至争吵的内容，从而让人停留在我的帖子上。我认为，通过延长帖子的停留时间、增加互动，可以争取更多的算法推流。\n\n这种方法你可以学，也可以不学，我只是提供一种快速上岸的路径。\n\n笨笨的路径就是靠图文对比，1—2张图 + 一句短评，文案极短、口语化，带点调侃和反差感，走的是段子手路线。\n\n这种方法如果得到系统大量推流，也可以在极短时间内通关。但缺点同样明显，素材容易同质化，搬运内容也可能被举报。\n\n还有一位兄弟，他可能是娱乐圈圈内人士，知道大量公众不知道的八卦，通过爆料迅速获得曝光，从而在10天内通过计划。\n\n这三种方法，说到底就是三条路：\n\n第一种，靠热点和争议吸引讨论。\n\n第二种，靠幽默和反差吸引传播。\n\n第三种，靠信息差和独家内容获取关注。\n\n当然，我也看到很多人，这三条路一条都不愿意走。\n\n其实完全没问题，你可以坚持自己的风格，可以做深度内容，可以分享专业知识，也可以踏踏实实输出干货。X本来就应该允许不同类型的创作者存在。\n\n但我觉得，既然选择做内容，就多少需要研究一下平台的传播逻辑，看看别人为什么能做起来，自己又有哪些地方值得改进。\n\n最怕的不是坚持自己的路线，而是既不愿意学习，也不愿意尝试，最后把别人的成功全部归结于运气，甚至心生嫉妒。\n\n上面这三种快速上岸的模板，我已经毫无保留地分享出来了。\n\n我也承认，这三条路多少都有一点擦边的成分，有的利用争议，有的靠调侃，有的依赖八卦。它们未必符合所有人的价值观，也不一定适合长期运营。\n\n但只要不造谣、不侵犯他人权益、不触碰平台规则，我觉得也没必要总是站在道德高地上审视别人的创作方式。\n\n毕竟大家来X做创作者，多少都有自己的目标。有人希望表达观点，有人希望扩大影响力，也有人希望获得一份额外收入。这些诉求并不矛盾，更谈不上谁比谁高尚。\n\n总结一下：\n\n我分享的不是成功学，更不是保证14天上岸的万能公式，只是三个真实案例，以及我从中观察到的一些规律。\n\n你可以不认同我们的内容，但不妨研究一下我们的传播方式。\n\n你可以不选择这三条路，但最好找到一条真正适合自己的路。\n\n内容创作没有标准答案，坚持原则和学习技巧也从来不是对立的。\n\n与其花时间羡慕别人为什么能上岸，不如多花一点时间研究，自己究竟差在哪里。\n\n希望大家都能早日上岸。", "chars": 1054, "date": "2026-11-04", "time": "16:35", "ts": 1793781319, "views": 21447, "likes": 207, "replies": 158, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117898474792374457"}, {"id": "2117911740323332180", "text": "不懂就问\n\n前段时间大家都认定全球大右转 \n\n为什么此刻美国几个红州翻蓝？", "chars": 37, "date": "2026-11-04", "time": "17:28", "ts": 1793784482, "views": 2521, "likes": 9, "replies": 5, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117911740323332180"}, {"id": "2117914275377500318", "text": "大家看到我14天上岸多风光，没看到我之前是怎么一条条啃王长富，香港老雷，杨伟的推文。怎么刷到爆帖收藏去研究语气，格式，排版，甚至emoji符号出现的位置。怎么研究算法喜欢的关键词，什么时间发什么类型的内容。同样的内容为什么一个人发不火，另一个人发就爆。都以为我运气好，其实后面都是血和泪😭", "chars": 144, "date": "2026-11-04", "time": "17:38", "ts": 1793785086, "views": 3564, "likes": 97, "replies": 86, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117914275377500318"}, {"id": "2117923996499120289", "text": "提个真诚的建议：\n\n不要去卷评论，他们能卷2000+是账号权重高，你去卷2000+就是影子封禁加冻结！", "chars": 51, "date": "2026-11-04", "time": "18:16", "ts": 1793787404, "views": 2887, "likes": 48, "replies": 52, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117923996499120289"}, {"id": "2117932479793520687", "text": "正式成为X工作者\n\n希望大家也找到自己的赛道\n早日薅老马的羊毛！", "chars": 32, "date": "2026-11-04", "time": "18:50", "ts": 1793789427, "views": 2610, "likes": 52, "replies": 74, "media": true, "url": "https://x.com/FKFKFKFKFKTB/status/2117932479793520687"}, {"id": "2117938021286694917", "text": "一个赚钱的小众赛道：\n\n去tictok教外国人说中文脏话！", "chars": 29, "date": "2026-11-04", "time": "19:12", "ts": 1793790748, "views": 1968, "likes": 8, "r const KEY = 'zs-target-ratings';
const st = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { toast('本地存储写入失败', true); } };

// 部署包里注入的仓库评分；localStorage 已有记录优先。
(() => {
  const seed = window.__ZS_SEED__ || {};
  let changed = false;
  Object.entries(seed).forEach(([id, v]) => {
    if (typeof v !== 'number' || st[id] != null) return;
    st[id] = v;
    changed = true;
  });
  if (changed) save();
})();
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
let toastTimer = null;
const toast = (msg, err) => {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 1600);
};

const scoreOf = id => (typeof st[id] === 'number' ? st[id] : null);

function stats() {
  const scored = POSTS.filter(p => scoreOf(p.id) !== null);
  const sum = scored.reduce((s, p) => s + scoreOf(p.id), 0);
  return { n: scored.length, avg: scored.length ? (sum / scored.length).toFixed(1) : '—' };
}

function updateCounters() {
  const { n, avg } = stats();
  $('#c-total').textContent = POSTS.length;
  $('#c-scored').textContent = n;
  $('#c-avg').textContent = avg;
}

/* ---------- 图表 ---------- */
const SVG_NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => { const n = document.createElementNS(SVG_NS, tag); Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v)); return n; };

function bars(host, data, color) {
  const max = Math.max(1, ...data.map(d => d.value));
  const h = 80, gap = 4, w = 240;
  const bw = Math.max(4, (w - gap * (data.length - 1)) / Math.max(1, data.length));
  const svg = svgEl('svg', { viewBox: `0 0 ${w} ${h + 26}` });
  data.forEach((d, i) => {
    const bh = Math.round((d.value / max) * h);
    const x = i * (bw + gap);
    svg.append(svgEl('rect', { x, y: h - bh, width: bw, height: Math.max(bh, d.value ? 2 : 0), rx: 2, fill: d.color || color }));
    const t = svgEl('text', { x: x + bw / 2, y: h + 12, 'text-anchor': 'middle', 'font-size': '8', fill: '#8b949e' });
    t.textContent = d.label; svg.append(t);
    if (d.value) {
      const v = svgEl('text', { x: x + bw / 2, y: h - bh - 3, 'text-anchor': 'middle', 'font-size': '8', fill: '#8b949e' });
      v.textContent = d.value; svg.append(v);
    }
  });
  host.replaceChildren(svg);
}

function donut(host, data) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const svg = svgEl('svg', { viewBox: '0 0 120 120' });
  const r = 44, cx = 60, cy = 60, c = 2 * Math.PI * r;
  let offset = 0;
  data.forEach(d => {
    if (!d.value) return;
    svg.append(svgEl('circle', {
      cx, cy, r, fill: 'none', stroke: d.color, 'stroke-width': 14,
      'stroke-dasharray': `${(d.value / total) * c} ${c}`, 'stroke-dashoffset': -offset,
      transform: `rotate(-90 ${cx} ${cy})`
    }));
    offset += (d.value / total) * c;
  });
  const center = svgEl('text', { x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: '#e6edf3', 'font-size': '18', 'font-weight': '600' });
  center.textContent = Math.round((data[0].value / total) * 100) + '%';
  svg.append(center);
  host.replaceChildren(svg);
  const legend = el('div', 'legend');
  data.forEach(d => {
    const s = el('span'); const i = el('i'); i.style.background = d.color;
    s.append(i, document.createTextNode(`${d.label} ${d.value}`)); legend.append(s);
  });
  host.append(legend);
}

function renderCharts() {
  const buckets = Array.from({ length: 11 }, (_, i) => ({ label: String(i), value: 0 }));
  POSTS.forEach(p => { const s = scoreOf(p.id); if (s !== null) buckets[s].value += 1; });
  if (!POSTS.some(p => scoreOf(p.id) !== null)) {
    $('#ch-score').replaceChildren(el('div', 'empty', '还没有评分：点下面的 0–10'));
  } else {
    bars($('#ch-score'), buckets, '#1f6feb');
  }
  const { n } = stats();
  donut($('#ch-progress'), [
    { label: '已评', value: n, color: '#3fb950' },
    { label: '未评', value: POSTS.length - n, color: '#30363d' }
  ]);
}

/* ---------- 卡片 ---------- */
function buildCard(p) {
  const card = el('div', 'card');
  card.dataset.id = p.id;
  const head = el('div', 'head');
  head.append(el('span', 'badge', p.date), el('span', 'badge', p.chars + ' 字'));
  if (p.media) head.append(el('span', 'badge t', '带图'));
  const scoreTag = el('span', 'state');
  head.append(scoreTag);

  const body = el('div', 'body');
  const textcol = el('div', 'textcol');
  textcol.append(el('div', 'text', p.text));
  body.append(textcol);

  const meta = el('div', 'meta');
  meta.append(el('span', null, `展示 ${p.views ?? '—'}`), el('span', null, `赞 ${p.likes ?? '—'}`),
    el('span', null, `回复 ${p.replies ?? '—'}`));
  const link = el('a', null, '原帖');
  link.href = p.url; link.target = '_blank'; link.rel = 'noopener'; link.style.color = 'var(--acc)';
  meta.append(link);

  const actions = el('div', 'actions');
  const rate = el('div', 'rate');
  const buttons = [];
  for (let i = 0; i <= 10; i++) {
    const b = el('button', null, String(i));
    b.addEventListener('click', () => { st[p.id] = i; save(); refresh(); applyFilter(); toast(`已评 ${i} 分`); });
    buttons.push(b); rate.append(b);
  }
  const clear = el('button', null, '清除');
  clear.addEventListener('click', () => { delete st[p.id]; save(); refresh(); applyFilter(); toast('已清除评分'); });
  actions.append(rate, clear);

  const foot = el('div', 'cardfoot');
  foot.append(meta, actions);
  card.append(head, body, foot);

  function refresh() {
    const s = scoreOf(p.id);
    buttons.forEach((b, i) => b.classList.toggle('on', s === i));
    scoreTag.className = 'state' + (s === null ? '' : (s >= 8 ? ' used' : (s <= 4 ? ' rejected' : ' edited')));
    scoreTag.textContent = s === null ? '未评分' : s + ' 分';
    updateCounters(); renderCharts();
  }
  card.refresh = refresh;
  refresh();
  return card;
}

function applyFilter() {
  const q = $('#q').value.trim().toLowerCase();
  const fs = $('#f-score').value, date = $('#f-date').value;
  let shown = 0;
  document.querySelectorAll('.card').forEach(card => {
    const p = card._p;
    const s = scoreOf(p.id);
    let ok = true;
    if (q && !p.text.toLowerCase().includes(q)) ok = false;
    if (ok && date && p.date !== date) ok = false;
    if (ok && fs) {
      if (fs === 'un') ok = s === null;
      else if (fs === 'high') ok = s !== null && s >= 9;
      else if (fs === 'mid') ok = s !== null && s >= 7 && s <= 8;
      else if (fs === 'low') ok = s !== null && s >= 5 && s <= 6;
      else if (fs === 'bad') ok = s !== null && s <= 4;
    }
    card.hidden = !ok;
    if (ok) shown++;
  });
  $('#c-total').textContent = POSTS.length;
  $('#c-scored').textContent = stats().n;
  $('#c-avg').textContent = stats().avg;
}

/* ---------- 启动 ---------- */
const list = $('#list');
const frag = document.createDocumentFragment();
[...POSTS].forEach(p => {
  const c = buildCard(p);
  c._p = p;
  frag.append(c);
});
list.append(frag);
applyFilter();

[...new Set(POSTS.map(p => p.date))].sort().forEach(d => { const o = el('option', null, d); o.value = d; $('#f-date').append(o); });

['q', 'f-score', 'f-date'].forEach(id => $('#' + id).addEventListener('input', applyFilter));
$('#f-sort').addEventListener('change', () => {
  const mode = $('#f-sort').value;
  const arr = [...POSTS].sort((a, b) => {
    if (mode === 'score') return (scoreOf(b.id) ?? -1) - (scoreOf(a.id) ?? -1);
    if (mode === 'views') return (b.views || 0) - (a.views || 0);
    return a.ts - b.ts;
  });
  list.replaceChildren(...arr.map(p => document.querySelector(`.card[data-id="${p.id}"]`)).filter(Boolean));
  applyFilter();
});

$('#autofill').addEventListener('click', () => {
  const pending = POSTS.filter(p => scoreOf(p.id) === null);
  if (!pending.length) { toast('没有未评分的帖子了'); return; }
  const v = p => Number(p.views) || 0;
  const n5 = pending.filter(p => v(p) > 10000).length;
  const n4 = pending.filter(p => v(p) > 1000 && v(p) <= 10000).length;
  const n1 = pending.length - n5 - n4;
  if (!confirm(`给剩下 ${pending.length} 条按展示补分？\n\n>10000 → 5 分：${n5} 条\n1000–10000 → 4 分：${n4} 条\n≤1000 → 1 分：${n1} 条`)) return;
  pending.forEach(p => { st[p.id] = v(p) > 10000 ? 5 : (v(p) > 1000 ? 4 : 1); });
  save();
  document.querySelectorAll('.card').forEach(c => c.refresh && c.refresh());
  applyFilter();
  toast(`已补 ${pending.length} 条`);
});

const rowsForSave = () => POSTS.filter(p => scoreOf(p.id) !== null).map(p => ({ id: p.id, score: scoreOf(p.id) }));

// 只有 site/serve.py 提供 POST /save；静态托管（Cloudflare Pages）上隐藏，避免点了报 404
if (!['127.0.0.1', 'localhost'].includes(location.hostname)) $('#save').hidden = true;
$('#save').addEventListener('click', async () => {
  const rows = rowsForSave();
  if (!rows.length) { toast('还没有评分', true); return; }
  try {
    const r = await fetch('/save?name=target-ratings.json', { method: 'POST', body: JSON.stringify(rows) });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    toast(`已写入 ${j.saved}（${j.rows} 条）`);
  } catch (e) {
    toast('保存失败：服务没开写入口，请用「导出评分」', true);
  }
});

$('#export').addEventListener('click', () => {
  const out = POSTS.filter(p => scoreOf(p.id) !== null).map(p => ({ id: p.id, score: scoreOf(p.id) }));
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'target-ratings.json'; a.click();
  URL.revokeObjectURL(a.href);
  toast(`已导出 ${out.length} 条`);
});

$('#import').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async () => {
  const f = $('#file').files[0]; if (!f) return;
  try {
    const rows = JSON.parse(await f.text());
    rows.forEach(r => { if (r && r.id && typeof r.score === 'number') st[r.id] = r.score; });
    save(); toast(`已导入 ${rows.length} 条`); setTimeout(() => location.reload(), 500);
  } catch (e) { toast('导入失败：不是合法 JSON', true); }
});

$('#reset').addEventListener('click', () => {
  if (!confirm('清空所有评分？')) return;
  localStorage.removeItem(KEY); location.reload();
});
</script>
