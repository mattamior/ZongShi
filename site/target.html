13593747367927859", "acct": "btcmos"}, {"id": "2113598957553356843", "text": "不懂就问\n\n香港法官头上为什么要戴黄毛？\n\n到底是自信还是自卑？\n@grok", "chars": 38, "date": "2026-10-23", "time": "19:50", "ts": 1792756234, "views": 954, "likes": 6, "replies": 16, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113598957553356843", "acct": "fkfk"}, {"id": "2113612700723151078", "text": "有一个疑问\n\n穆斯林这个群体\n\n在全世界都是麻烦的制造者\n\n为什么唯独在中国\n\n被治的服服帖帖？", "chars": 48, "date": "2026-10-23", "time": "20:45", "ts": 1792759511, "views": 1613, "likes": 7, "replies": 5, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113612700723151078", "acct": "fkfk"}, {"id": "2113621984206832039", "text": "不懂就问\n\n男的去按摩全套才几百\n\n女的去按摩怎么也这么贵？", "chars": 30, "date": "2026-10-23", "time": "21:22", "ts": 1792761724, "views": 1403, "likes": 1, "replies": 1, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113621984206832039", "acct": "fkfk"}, {"id": "2113626040182747300", "text": "最新消息——中共中央政治局召开会议 审议《关于二十届中央第七轮巡视情况的综合报告》\n\n我来一句话总结这个报告：反腐还会继续，抓人还会继续\n\n当官的现在还是要低调！\n\n要不然老大就会关照他！\n\n现在当官是高风险，不知道哪天就进去了", "chars": 114, "date": "2026-10-23", "time": "21:38", "ts": 1792762691, "views": 12133, "likes": 13, "replies": 10, "media": true, "url": "https://x.com/btcmos/status/2113626040182747300", "acct": "btcmos"}, {"id": "2113629267418660890", "text": "我有一个重大发现：中国的监狱现在是真牛逼，完全是正球级配置\n\n一个正国级书记——周永康为代表\n三个副国级委员。\n\n三个军委副主席——张又侠为代表\n两个国防部长。\n\n这也太牛逼了！\n\n这要是在战时末日，是不是都可以重组一个高级指挥领导班子了？", "chars": 120, "date": "2026-10-23", "time": "21:51", "ts": 1792763461, "views": 44904, "likes": 60, "replies": 44, "media": true, "url": "https://x.com/btcmos/status/2113629267418660890", "acct": "btcmos"}, {"id": "2113636827693523431", "text": "我刚刚听我朋友说\n\n创作者激励的X账号在闲鱼上\n\n能卖六万块钱\n\n真假？", "chars": 36, "date": "2026-10-23", "time": "22:21", "ts": 1792765263, "views": 1021, "likes": 4, "replies": 5, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113636827693523431", "acct": "fkfk"}, {"id": "2113638292193485238", "text": "请问：有人说中国古代的通房丫鬟 是不是就和男主人的飞机杯差不多？\n\n既不是妻，也不是妾，啥名分也没有\n\n@grok \n\n真是这样？\n那图什么？图吃饱饭吗？还是图上位可能性？", "chars": 86, "date": "2026-10-23", "time": "22:26", "ts": 1792765613, "views": 40841, "likes": 33, "replies": 39, "media": false, "url": "https://x.com/btcmos/status/2113638292193485238", "acct": "btcmos"}, {"id": "2113641281763295391", "text": "到现在我都想不明白\n\n当年俄罗斯进攻基辅的一字长蛇阵\n\n到底是哪个傻逼指挥的！", "chars": 39, "date": "2026-10-23", "time": "22:38", "ts": 1792766325, "views": 643, "likes": 2, "replies": 0, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113641281763295391", "acct": "fkfk"}, {"id": "2113645544304427386", "text": "我看到一种说法：中国的建国一代最高领导很多有直接抢拿博物馆文物行为\n\n比如康生、陈伯达、叶群、黄永胜、李作鹏等人都有这种行为，甚至互相赠送\n\n@grok请问是真的？\n\n他们为什么敢这样做？\n认为这个国家是他们打下的，所以想拿什么就拿什么？", "chars": 119, "date": "2026-10-23", "time": "22:55", "ts": 1792767342, "views": 14307, "likes": 29, "replies": 9, "media": false, "url": "https://x.com/btcmos/status/2113645544304427386", "acct": "btcmos"}, {"id": "2113651202521182312", "text": "不懂就问\n\n俄罗斯有这么多核武器\n\n为什么欧美一点都不怕呢？", "chars": 30, "date": "2026-10-23", "time": "23:18", "ts": 1792768691, "views": 652, "likes": 4, "replies": 5, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113651202521182312", "acct": "fkfk"}, {"id": "2113653053077467296", "text": "有人说杨兰兰背景通天，\n\n和那个男人的大哥有关系！\n这说法是真的假的？@grok\n\n为什么她犯了这么大的事，却没有一点私人信息泄露出来？有人压消息？\n\n你直接回答，不必避讳，大胆的说！", "chars": 92, "date": "2026-10-23", "time": "23:25", "ts": 1792769132, "views": 44328, "likes": 14, "replies": 29, "media": false, "url": "https://x.com/btcmos/status/2113653053077467296", "acct": "btcmos"}, {"id": "2113656382176260568", "text": "金正恩执政已经14年10个月了\n\n三代领导人：金日成 → 金正日 → 金正恩。金正恩是不是能力最强的？\n\n和俄罗斯普京的能力相比呢？\n\n@grok\n\n你给金家三代和普京的能力做个排名", "chars": 91, "date": "2026-10-23", "time": "23:38", "ts": 1792769926, "views": 16319, "likes": 11, "replies": 8, "media": false, "url": "https://x.com/btcmos/status/2113656382176260568", "acct": "btcmos"}, {"id": "2113659420039319741", "text": "土耳其，巴西，朝鲜，日本，中国\n\n哪个国家的几把最长？\n\n其余的也给出具体排名\n\n@grok", "chars": 46, "date": "2026-10-23", "time": "23:50", "ts": 1792770650, "views": 1413, "likes": 7, "replies": 6, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113659420039319741", "acct": "fkfk"}, {"id": "2113661225515266469", "text": "天塌了！\n\n大家发现没有？\n推特黄推基本——全体跑路了！\n\n饼干姐封了、噗噗停更、草莓停更…\n\n这是被扫黄了吗？还是被抓了？", "chars": 62, "date": "2026-10-23", "time": "23:58", "ts": 1792771080, "views": 2080551, "likes": 1332, "replies": 861, "media": false, "url": "https://x.com/btcmos/status/2113661225515266469", "acct": "btcmos"}, {"id": "2113665014565589424", "text": "泽连斯基：求求给我吃一口吧🤣", "chars": 14, "date": "2026-10-24", "time": "00:13", "ts": 1792771984, "views": 1435, "likes": 9, "replies": 8, "media": true, "url": "https://x.com/FKFKFKFKFKTB/status/2113665014565589424", "acct": "fkfk"}, {"id": "2113667705865920762", "text": "中国最牛逼的一个民族：\n\n四川的彝族，\n\n据说现在还有抓娃子，然后据说一个个还死倔死倔的！\n\n知道抓娃子是干啥？说出来吓死你", "chars": 62, "date": "2026-10-24", "time": "00:23", "ts": 1792772625, "views": 722589, "likes": 395, "replies": 748, "media": false, "url": "https://x.com/btcmos/status/2113667705865920762", "acct": "btcmos"}, {"id": "2113670915074801744", "text": "我说个超级大爆论：\n\n房产这个雷爆了，\n和大哥没大关系，\n主要是江湖搞的，\n他只是遇到了！\n\n但是社保疫情的雷，\n舆论空间的缩小，\n确实和他有大关系。\n他也有那个实力改。\n\n现在的所有事也只有他能变了！", "chars": 101, "date": "2026-10-24", "time": "00:36", "ts": 1792773390, "views": 36846, "likes": 100, "replies": 37, "media": false, "url": "https://x.com/btcmos/status/2113670915074801744", "acct": "btcmos"}, {"id": "2113677305642127857", "text": "最新消息：中文区的原创收益发了！\n\n大家想不想看我的？？？\n\n我考虑考虑要不要发出来！！", "chars": 44, "date": "2026-10-24", "time": "01:01", "ts": 1792774914, "views": 14551, "likes": 202, "replies": 425, "media": false, "url": "https://x.com/btcmos/status/2113677305642127857", "acct": "btcmos"}, {"id": "2113812462105735337", "text": "两周一次的最新一期原创收益又发了！\n\n十四天——4292.6美元(有录屏)\n\n我知道中文圈比这个收益多的不多，可能就一两三个，也可能……\n\n犹豫思考，\n要不要发！\n我说过我最在意的是体量的快速成长，也不想和全球网友卷这个。\n这点原创收益，是我为了体量快速上升过程中的副产品！\n\n还是继续说这两周的心路历程吧：\n希望能继续给大家一点鼓励\n\n1，第一周初期\n这个阶段我的流量每天都很稳定，日阅读量没有低于300万的！\n整体上我还是维持了原本写作风格，心态很稳定，保持内容有可读性和有趣是我的底线。\n这里说下，谁要说我发的内容有造谣的，你就立马滚吧，我这里绝对100%不可能有造谣的内容，你别给自己的无能找心里安慰。\n\n2，第二周前后两三天\n这个阶段算法突然调整，市场上大家基本都没流量了，我的日流量突然掉到了100-250万，\n这时候我就有点警惕了，为了保持增长，我增加了部分擦边、政治段子，\n了解我的都知道这并不是我想触碰的！\n\n3，内容调整\n临时增加写了几天擦边、政治，我是觉得这样下去不行的，我从始至终不想让账号和黄推和政治有一丝丝关联。\n\n所以我现在是能写历史不写政治，能写新闻不碰擦边，\n非要碰政治，能写普丁不写他，能提金正恩不提他。\n如果你非碰东方大国的政治不可，我建议你的尺度不要超过王志安。\n\n我的思考：\n政治是毒品，\n色情是春药，\n谣言是毒烟！\n\n玩X的底线是不造谣，尽量不碰太敏感政治，绝对不能走上太黄推路线！\n\n我说过了，\n全球范围内我这个增长速度仅次于事件营销网红和现象级网红或者行业大佬，\n\n但是他们自己也复制不了自己，因为有太多偶然和运气和 平台抬咖成分，类似于要么买彩票中奖，要么你是黄仁勋！\n\n如果你想稳扎稳打的绝对快速起飞，不装逼的说，那在全球范围内我绝对是最值得学习和借鉴的，没有之一！\n\n最后的最后\n\n我再次说下：我的一切内容免费对全球中文社区的所有同事、同仁、兄弟姐妹、朋友、亲人……开源！\n\n大家尽情的拿去改编，\n\n任意的拿去作为灵感来源！\n\nX肯定还在——最早期\n\n最早期！\n最早期！\n最早期！\n\n而不仅仅是红利期！\n\n下周我要办点事情，可能好几天时间都会是抽空发推，肯定没时间找热点，\n所以必然没太多时间给你提供爆文思路和灵感，\n爆文能不能爆是可以猜出来的\n\n大家理解下！\n\n加油！\n\n一年时间，顶峰相见！", "chars": 974, "date": "2026-10-24", "time": "09:58", "ts": 1792807138, "views": 136512, "likes": 870, "replies": 904, "media": true, "url": "https://x.com/btcmos/status/2113812462105735337", "acct": "btcmos"}, {"id": "2113821736995323981", "text": "狗中哈士奇，国中土耳其🇹🇷\n俄罗斯战机飞进土耳其领空，土耳其人怒了，转头就把荷兰国旗给烧了。🇳🇱\n荷兰人气得破口大骂，土耳其人更生气了，转身又把法国国旗烧了。😂\n为了抗议中国，土耳其人走上街头游行，结果把一名韩国人认成中国人，直接给揍了一顿。😭\n更抽象的是，有人跑到泰国大使馆门口抗议，最后烧的竟然是越南国旗。😂\n别笑了，再笑就把比利时国旗烧了！\n这就是传说中的土耳其式抗议。🤣", "chars": 189, "date": "2026-10-24", "time": "10:35", "ts": 1792809349, "views": 955, "likes": 5, "replies": 1, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2113821736995323981", "acct": "fkfk"}, {"id": "2113825005276713021", "text": "我玩推特的一点思考：\n\n造谣是毒药，\n政治是毒品，\n色情是春药。\n\n如果实在写无可写，\n新闻、历史、娱乐、外国政治或许就是万艾可！", "chars": 65, "date": "2026-10-24", "time": "10:48", "ts": 1792810128, "views": 8978, "likes": 102, "replies": 129, "media": false, "url": "https://x.com/btcmos/status/2113825005276713021", "acct": "btcmos"}, {"id": "2113827096351125770", "text": "如果现在武统台湾\n\n日本介入\n\n中国能不能把日本也干趴下？\n\n@grok", "chars": 36, "date": "2026-10-24 膏是螃蟹的精液\n\n为什么没有人把人类的精液拿去煮\n\n会不会比螃蟹的更软糯Q弹？", "chars": 51, "date": "2026-11-04", "time": "14:21", "ts": 1793773308, "views": 5878, "likes": 36, "replies": 34, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117864872008667286", "acct": "fkfk"}, {"id": "2117870767803404330", "text": "男人是不是强到一定程度，艹B已经不能刺激他了，只有艹男人才能让他爽？\n@grok\n\n比如：易建联 ，他到底是什么心理？", "chars": 59, "date": "2026-11-04", "time": "14:45", "ts": 1793774713, "views": 88055, "likes": 60, "replies": 58, "media": false, "url": "https://x.com/btcmos/status/2117870767803404330", "acct": "btcmos"}, {"id": "2117881547609285109", "text": "不懂就问\n\n既然德克萨斯都能翻蓝\n\n朝鲜为什么不能翻蓝？", "chars": 28, "date": "2026-11-04", "time": "15:28", "ts": 1793777283, "views": 3341, "likes": 23, "replies": 13, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117881547609285109", "acct": "fkfk"}, {"id": "2117882224666382658", "text": "打飞机\n爱嫖娼\n不健身\n抽烟\n喝酒\n婚育\n坐牢\n性瘾\n看色情片\n\n@grok 哪一个最可能短命？\n你给他们的危害做个危害度排名？", "chars": 64, "date": "2026-11-04", "time": "15:30", "ts": 1793777445, "views": 11099, "likes": 34, "replies": 27, "media": false, "url": "https://x.com/btcmos/status/2117882224666382658", "acct": "btcmos"}, {"id": "2117892336055443846", "text": "美国中期选举正在开票，感觉自己正在见证历史。\n\n1. 佐治亚州：诞生美国历史上首位非裔女性州长。\n\n2. 得克萨斯州：时隔32年首次实现政党轮替，同时选出该州首位拉丁裔女性州长。\n\n3. 佛罗里达州：选出美国历史上首位民选共和党非裔州长，双方仅相差约1.4个百分点，选情异常激烈。\n\n4. 新罕布什尔州：诞生美国历史上首位公开同性恋身份的男性联邦参议员。\n\n5. 新墨西哥州：诞生美国历史上首位原住民女性州长。\n\n这场选举，无论红蓝阵营，都创造了多个历史纪录。\n\n美国建国250年，竟然还有这么多历史性的第一次，确实令人感慨。\n\n尤其是德州变蓝，实在太特别了。", "chars": 280, "date": "2026-11-04", "time": "16:10", "ts": 1793779856, "views": 3196, "likes": 11, "replies": 5, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117892336055443846", "acct": "fkfk"}, {"id": "2117898474792374457", "text": "说句实话：\n\n我所知道的两周内上岸的有三个，首先是我和笨笨，都是14天，还有一位是10天内，但是我记不清他的ID了。\n\n我的路径主要是以追求热点和制造冲突为导向。无论纯文字还是图文，都需要输出我想让人讨论，甚至争吵的内容，从而让人停留在我的帖子上。我认为，通过延长帖子的停留时间、增加互动，可以争取更多的算法推流。\n\n这种方法你可以学，也可以不学，我只是提供一种快速上岸的路径。\n\n笨笨的路径就是靠图文对比，1—2张图 + 一句短评，文案极短、口语化，带点调侃和反差感，走的是段子手路线。\n\n这种方法如果得到系统大量推流，也可以在极短时间内通关。但缺点同样明显，素材容易同质化，搬运内容也可能被举报。\n\n还有一位兄弟，他可能是娱乐圈圈内人士，知道大量公众不知道的八卦，通过爆料迅速获得曝光，从而在10天内通过计划。\n\n这三种方法，说到底就是三条路：\n\n第一种，靠热点和争议吸引讨论。\n\n第二种，靠幽默和反差吸引传播。\n\n第三种，靠信息差和独家内容获取关注。\n\n当然，我也看到很多人，这三条路一条都不愿意走。\n\n其实完全没问题，你可以坚持自己的风格，可以做深度内容，可以分享专业知识，也可以踏踏实实输出干货。X本来就应该允许不同类型的创作者存在。\n\n但我觉得，既然选择做内容，就多少需要研究一下平台的传播逻辑，看看别人为什么能做起来，自己又有哪些地方值得改进。\n\n最怕的不是坚持自己的路线，而是既不愿意学习，也不愿意尝试，最后把别人的成功全部归结于运气，甚至心生嫉妒。\n\n上面这三种快速上岸的模板，我已经毫无保留地分享出来了。\n\n我也承认，这三条路多少都有一点擦边的成分，有的利用争议，有的靠调侃，有的依赖八卦。它们未必符合所有人的价值观，也不一定适合长期运营。\n\n但只要不造谣、不侵犯他人权益、不触碰平台规则，我觉得也没必要总是站在道德高地上审视别人的创作方式。\n\n毕竟大家来X做创作者，多少都有自己的目标。有人希望表达观点，有人希望扩大影响力，也有人希望获得一份额外收入。这些诉求并不矛盾，更谈不上谁比谁高尚。\n\n总结一下：\n\n我分享的不是成功学，更不是保证14天上岸的万能公式，只是三个真实案例，以及我从中观察到的一些规律。\n\n你可以不认同我们的内容，但不妨研究一下我们的传播方式。\n\n你可以不选择这三条路，但最好找到一条真正适合自己的路。\n\n内容创作没有标准答案，坚持原则和学习技巧也从来不是对立的。\n\n与其花时间羡慕别人为什么能上岸，不如多花一点时间研究，自己究竟差在哪里。\n\n希望大家都能早日上岸。", "chars": 1054, "date": "2026-11-04", "time": "16:35", "ts": 1793781319, "views": 21447, "likes": 207, "replies": 158, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117898474792374457", "acct": "fkfk"}, {"id": "2117908581068505591", "text": "中期选举大局已定——四输四赢\n\n川普输了，\n共和党输了，\n马斯克输了，\n保守派输了。\n\n币圈失去了一个重要的政治盟友。\n\n白左阵营再次获得政治反弹空间。\n\n中国雌权、LGBT……又可以嗨了！\n\nA股似乎也赢了？？？", "chars": 107, "date": "2026-11-04", "time": "17:15", "ts": 1793783729, "views": 13847, "likes": 74, "replies": 40, "media": false, "url": "https://x.com/btcmos/status/2117908581068505591", "acct": "btcmos"}, {"id": "2117911740323332180", "text": "不懂就问\n\n前段时间大家都认定全球大右转 \n\n为什么此刻美国几个红州翻蓝？", "chars": 37, "date": "2026-11-04", "time": "17:28", "ts": 1793784482, "views": 2521, "likes": 9, "replies": 5, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2117911740323332180", "acct": "fkfk"}, {"id": "2117914275377500318", "text": "大家看到我14天上岸多风光，没看到我之前是怎么一条条啃王长富，香港老雷，杨伟的推文。怎么刷到爆帖收藏去研究语气，格式，排版，甚至emoji符号出现的位置。怎么研究算法喜欢的关键词，什么时间发什么类型的内容。同样的内容为什么一个人发不火，另一个人发就爆。都以为我运气好，其实后面都是血和泪😭", "chars": 144, "date": "2026-11-04", "time": "17:38", "ts": 1793785086 n会不会比今天好？还会有改革开放吗？", "chars": 84, "date": "2026-11-05", "time": "18:51", "ts": 1793875867, "views": 25369, "likes": 19, "replies": 11, "media": false, "url": "https://x.com/btcmos/status/2118295035536125953", "acct": "btcmos"}, {"id": "2118298156974879113", "text": "我很好奇\n\n波多野结衣和LeBron到底谁先退役？", "chars": 25, "date": "2026-11-05", "time": "19:03", "ts": 1793876611, "views": 791, "likes": 5, "replies": 3, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2118298156974879113", "acct": "fkfk"}, {"id": "2118300974850908654", "text": "那个男人是真牛逼啊！！\n\n上次拜登败选前后，那个男人就安排了个紧急大会面，算是没把路走死。\n\n没落井下石！\n\n这次他应该早就预测到川普会败选，\n所以提前和普丁商量好三人来个世纪大会面。\n\n如今地球不得不再次迎来全面左转，\n民主党最擅长的就是联盟对抗，\n欧美日韩肯定又要搞一起去了！\n\n中国的日子可能并不会比川普的共和党大权独揽时代好过，\n只是玩法变了，做好心理准备吧！", "chars": 184, "date": "2026-11-05", "time": "19:14", "ts": 1793877283, "views": 26543, "likes": 49, "replies": 18, "media": false, "url": "https://x.com/btcmos/status/2118300974850908654", "acct": "btcmos"}, {"id": "2118305654490403018", "text": "我艹\n黄之锋又被判了10年\n算是被杀鸡儆猴了！\n\n原定明年1月可释放，现在又续杯了！\n\n我做个大胆的预测：这种就是不想让他出来，算是对此前闹事的人的震慑！\n\n也是给其他所有人的警告", "chars": 90, "date": "2026-11-05", "time": "19:33", "ts": 1793878398, "views": 14474, "likes": 93, "replies": 52, "media": false, "url": "https://x.com/btcmos/status/2118305654490403018", "acct": "btcmos"}, {"id": "2118317192303526096", "text": "如果说以前的东莞是中国性都，那么现在的“世界性都”是哪里？\n\n@grok\n\n你说五个城市，卖淫嫖娼前五排名！", "chars": 54, "date": "2026-11-05", "time": "20:19", "ts": 1793881149, "views": 36160, "likes": 36, "replies": 17, "media": false, "url": "https://x.com/btcmos/status/2118317192303526096", "acct": "btcmos"}, {"id": "2118326802351579352", "text": "2026年以来中国抓捕的主要官员：\n\n——副部级以下都没资格入选名单——\n\n中央政治局委员、中央军委副主席级\n\n1，张又侠——中共中央政治局委员、中央军委副主席，1月24日。\n2，马兴瑞——中共中央政治局委员、新疆维吾尔自治区党委原书记，4月3日。\n\n中央军委委员级\n刘振立——中央军委委员、中央军委联合参谋部参谋长，1月24日。\n\n正部级党政干部\n1，王祥喜——应急管理部党组书记、部长，1月31日。\n2，孙绍骋——内蒙古自治区党委原书记，1月29日。\n3，易炼红——浙江省委原书记、全国人大财政经济委员会副主任委员，2月10日。\n4，胡衡华——重庆市委副书记、市长，3月20日。\n5，叶建春——江西省委副书记、省长，8月27日。\n\n副部级党政干部\n\n1，雷思维——甘肃省委原常委、副省长，3月17日。\n2，刘建洋——江苏省委常委、组织部部长，8月31日。\n3，张硕辅——广东省人大常委会党组成员、副主任，10月8日。\n4，黄奇帆——重庆市委原副书记、市长，10月13日。\n5，黄日波——广西壮族自治区政协原副主席，10月18日。\n夏林茂——北京市委常委、副市长，10月22日。\n6，鲁昕——教育部原党组成员、副部长，9月28日。\n\n正部级及重要央企负责人\n\n1，傅成玉——中国石油化工集团原党组书记、董事长，10月31日。\n2，辛保安——国家电网原党组书记、董事长，7月31日。\n3，国文清——中国五矿集团原党组副书记、总经理，7月31日。\n\n副部级及其他央企负责人\n\n1，方星海——中国证监会原党委委员、副主席，7月24日。\n2，欧阳卫民——国家开发银行原党委副书记、行长，7月19日。\n3，顾军——中国核工业集团原党组副书记、总经理，1月19日。\n4，陈勇——中国建筑集团有限公司党组成员、副总经理，9月5日。\n5，宋致远——中国东方电气集团原党组副书记、董事，8月8日。\n6，李兴龙——中国铁道建筑集团有限公司党委常委，11月4日。\n最后一个哥们最搞笑，5天前刚辞职，昨天就被抓了。\n\n你看看这是不是杀疯了？\n现在当官绝对的是赌命，\n绝对的高风险职业！\n\n不得不说是真牛逼！\n\n我想问的是：为何反腐这么多年了，腐败依然还是这么严重呢？\n有没有特别懂得兄弟姐妹说说？\n\n我还没当上官，\n\n都已经吓尿了！", "chars": 955, "date": "2026-11-05", "time": "20:57", "ts": 1793883440, "views": 62907, "likes": 80, "replies": 24, "media": false, "url": "https://x.com/btcmos/status/2118326802351579352", "acct": "btcmos"}, {"id": "2118329578817286338", "text": "←刚打完飞机回来", "chars": 8, "date": "2026-11-05", "time": "21:08", "ts": 1793884102, "views": 2087, "likes": 9, "replies": 2, "media": false, "url": "https://x.com/FKFKFKFKFKTB/status/2118329578817286338", "acct": "fkfk"}, {"id": "2118334034719937007", "text": "我有一个超级反贼朋友，\n\n他经常使用搜狗、百度、华为、小米……输入法输入敏感人物 和 敏感词语\n\n你认为他有没有被监控的风险？@grok\n\n他的日常使用习惯和使用数据会不会自动上传给国安？然后成为未来抓捕的证据", "chars": 105, "date": "2026-11-05", "time": "21:26", "ts": 1793885165, "views": 8780, "likes": 16, "replies": 25, "media": false, "url": "https://x.com/btcmos/status/2118334034719937007", "acct": "btcmos"}, {"id": "2118337979743928491", "text": "我有一个小兄弟月薪2万，他说他是上海收入的前1％，@grok这说的对？\n\n请直接告诉我是否正确！\n\n北上广深总人数是多少？\n青壮年劳动力总人数是多少？\n税后月薪1万以上的人口占比是多少？", "chars": 93, "date": "2026-11-05", "time": "21:41", "ts": 1793886105, "views": 9879, "likes": 11, "replies": 14, "media": false, "url": "https://x.com/btcmos/status/2118337979743928491", "acct": "btcmos"}, {"id": "2118338331469852951", "text": "卧槽尼玛！\n\n你们一天五六十条帖子到底怎么发的\n\n我他妈腹泻都拉不出这么多\n\n天天发20条要我老命了😤😤", "chars": 52, "date": "2026-11-05", "time": "21:43", "ts": 1793886189, const KEY = 'zs-target-ratings';
let acct = '';
let booting = true;
let queued = null;
const st = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } })();
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { toast('本地存储写入失败', true); }

  const seed = window.__ZS_SEED__ || {};
  let changed = false;
  Object.entries(seed).forEach(([id, v]) => {
    if (typeof v !== 'number' || st[id] != null) return;
    st[id] = v;
    changed = true;
  });
  if (changed) save();

/* ---------- 与线上同步（/api/state） ---------- */
const SYNC = '/api/state';
function scheduleSync() {
  if (booting) return;
  clearTimeout(queued);
  queued = setTimeout(pushState, 800);
}

async function pushState() {
  try {
    const r = await fetch(SYNC, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ratings: st }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setSync('ok', '已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }));
    updateCounters();
  } catch (e) {
    setSync('err', '同步失败');
    toast('同步失败：评分只存在本机', true);
  }
}

async function pullState() {
  setSync('wait', '同步中');
  try {
    const r = await fetch(SYNC, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    const remote = (d && d.ratings) || {};
    const localOnly = Object.keys(st).some(id => !(id in remote));
    Object.entries(remote).forEach(([id, v]) => { if (typeof v === 'number') st[id] = v; });
    try { localStorage.setItem(KEY, JSON.stringify(st)); }
    catch (e) { toast('本地存储写入失败', true); }
    setSync('ok', '已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }));
    if (localOnly) { booting = false; scheduleSync(); }
  } catch (e) {
    setSync('err', '离线');
  }
}

const scoreOf = id => (typeof st[id] === 'number' ? st[id] : null);

function stats(list) {
  const scored = list.filter(p => scoreOf(p.id) !== null);
  const sum = scored.reduce((s, p) => s + scoreOf(p.id), 0);
  return { n: scored.length, avg: scored.length ? (sum / scored.length).toFixed(1) : '—' };
}

/* ---------- 图表 ---------- */
const SVG_NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => {
  const n = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v));
  return n;
};
const svgTitle = text => {
  const t = document.createElementNS(SVG_NS, 'title');
  t.textContent = text;
  return t;
};

function vbarChart(host, data, opts = {}) {
  const W = 520, H = 150, padL = 26, padR = 10, padT = 12, padB = 22;
  const total = data.reduce((a, d) => a + d.value, 0);
  const peak = Math.max(1, ...data.map(d => d.value));
  const mag = Math.pow(10, Math.floor(Math.log10(peak)));
  const raw = peak / mag;
  const ladder = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  const max = (ladder.find(v => v >= raw) || 10) * mag;
  const iw = W - padL - padR, ih = H - padT - padB;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, 'aria-label': opts.label || '图表' });
  [0, 0.5, 1].forEach(f => {
    const y = padT + ih - f * ih;
    svg.append(svgEl('line', { x1: padL, x2: W - padR, y1: y, y2: y, stroke: f ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.12)' }));
    const t = svgEl('text', { x: padL - 6, y: y + 3, 'text-anchor': 'end', 'font-size': 8.5, fill: '#6f6f6f' });
    t.textContent = Math.round(max * f);
    svg.append(t);
  });
  const n = data.length;
  const gap = n > 10 ? 4 : 10;
  const bw = Math.max(3, (iw - gap * (n - 1)) / n);
  const step = n > 1 ? (iw - bw) / (n - 1) : 0;
  data.forEach((d, i) => {
    const bh = d.value ? Math.max(Math.round((d.value / max) * ih), 2) : 0;
    const x = padL + i * step;
    const rect = svgEl('rect', {
      x, y: padT + ih - bh, width: bw, height: bh,
      rx: Math.min(3, bw / 2), fill: d.color || opts.color || '#3b82f6',
    });
    rect.append(svgTitle(`${d.label} 分：${fmt(d.value)} 条`));
    svg.append(rect);
    if (opts.showValues && d.value) {
      const v = svgEl('text', { x: x + bw / 2, y: padT + ih - bh - 4, 'text-anchor': 'middle', 'font-size': 8.5, fill: '#8a8a8a' });
      v.textContent = d.value;
      svg.append(v);
    }
    const t = svgEl('text', { x: x + bw / 2, y: H - 7, 'text-anchor': 'middle', 'font-size': 8.5, fill: '#6f6f6f' });
    t.textContent = d.label;
    svg.append(t);
  });
  host.replaceChildren(svg);
}

function donutChart(host, data, total, centerLabel) {
  const S = 132, r = 52, w = 13, c = 2 * Math.PI * r;
  const svg = svgEl('svg', { viewBox: `0 0 ${S} ${S}`, 'aria-label': '评分进度' });
  svg.append(svgEl('circle', { cx: S / 2, cy: S / 2, r, fill: 'none', stroke: 'rgba(255,255,255,.07)', 'stroke-width': w }));
  let off = 0;
  data.forEach(d => {
    if (!d.value) return;
    const len = (d.value / total) * c;
    const seg = svgEl('circle', {
      cx: S / 2, cy: S / 2, r, fill: 'none', stroke: d.color, 'stroke-width': w,
      'stroke-dasharray': `${Math.max(len - 2.5, 0.6)} ${c}`,
      'stroke-dashoffset': -off,
      transform: `rotate(-90 ${S / 2} ${S / 2})`,
      'stroke-linecap': 'round',
    });
    seg.append(svgTitle(`${d.label}：${fmt(d.value)}`));
    off += len;
    svg.append(seg);
  });
  const pct = Math.round((data[0].value / total) * 100);
  const big = svgEl('text', { x: S / 2, y: S / 2 - 1, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'donut-center' });
  big.textContent = pct + '%';
  const unit = svgEl('text', { x: S / 2, y: S / 2 + 16, 'text-anchor': 'middle', class: 'donut-sub' });
  unit.textContent = centerLabel || '已评';
  svg.append(big, unit);

  const legend = el('div', 'legend');
  data.forEach(d => {
    const row = el('div', 'row');
    const dot = el('i');
    dot.style.background = d.color;
    row.append(dot, document.createTextNode(d.label), el('b', null, fmt(d.value)),
      el('span', 'pct', Math.round(d.value / total * 100) + '%'));
    legend.append(row);
  });
  const wrap = el('div', 'donut-wrap');
  wrap.append(svg, legend);
  host.replaceChildren(wrap);
}

function renderCharts() {
  const list = visiblePosts();
  const buckets = Array.from({ length: 11 }, (_, i) => ({ label: String(i), value: 0 }));
  list.forEach(p => { const s = scoreOf(p.id); if (s !== null) buckets[s].value += 1; });
  const colorFor = i => i <= 2 ? '#f87171' : i <= 4 ? '#fb923c' : i <= 6 ? '#eab308' : i <= 8 ? '#3b82f6' : '#34d399';
  buckets.forEach((b, i) => { b.color = colorFor(i); });
  const { n, avg } = stats(list);
  if (!n) {
    $('#ch-score').replaceChildren(el('div', 'empty', '还没有评分：点下面的 0–10 给对标帖打分'));
    $('#h-score').textContent = '';
  } else {
    vbarChart($('#ch-score'), buckets, { showValues: true, label: '评分分布' });
    $('#h-score').textContent = `${fmt(n)} 条已评 · 均分 ${avg}`;
  }
  donutChart($('#ch-progress'), [
    { label: '已评', value: n, color: '#34d399' },
    { label: '未评', value: list.length - n, color: '#4d4d4d' },
  ], list.length || 1, '已评');
  $('#h-progress').textContent = `${fmt(list.length - n)} 条未评`;
}

  meta.append(link);

  const actions = el('div', 'actions');
  const rate = el('div', 'rate');
  const buttons = [];
  for (let i = 0; i <= 10; i++) {
    const b = el('button', null, String(i));
    b.addEventListener('click', () => { st[p.id] = i; save(); refresh(); applyFilter(); toast(`已评 ${i} 分`); });
    buttons.push(b); rate.append(b);
  }
  const clear = el('button', null, '清除');
  clear.addEventListener('click', () => { delete st[p.id]; save(); refresh(); applyFilter(); toast('已清除评分'); });
  actions.append(rate, clear);

  const foot = el('div', 'cardfoot');
  foot.append(meta, actions);
  card.append(head, body, foot);

  function refresh() {
    const s = scoreOf(p.id);
    buttons.forEach((b, i) => b.classList.toggle('on', s === i));
    scoreTag.className = 'state' + (s === null ? '' : (s >= 8 ? ' used' : (s <= 4 ? ' rejected' : ' edited')));
    scoreTag.textContent = s === null ? '未评分' : s + ' 分';
    updateCounters(); renderCharts();
  }
  card.refresh = refresh;
  refresh();
  return card;
}

function applyFilter() {
  const q = $('#q').value.trim().toLowerCase();
  const fs = $('#f-score').value, date = $('#f-date').value;
  let shown = 0;
  document.querySelectorAll('.card').forEach(card => {
    const p = card._p;
    const s = scoreOf(p.id);
    let ok = true;
    if (acct && p.acct !== acct) ok = false;
    if (ok && q && !p.text.toLowerCase().includes(q)) ok = false;
    if (ok && date && p.date !== date) ok = false;
    if (ok && fs) {
      if (fs === 'un') ok = s === null;
      else if (fs === 'high') ok = s !== null && s >= 9;
      else if (fs === 'mid') ok = s !== null && s >= 7 && s <= 8;
      else if (fs === 'low') ok = s !== null && s >= 5 && s <= 6;
      else if (fs === 'bad') ok = s !== null && s <= 4;
    }
    card.hidden = !ok;
    if (ok) shown++;
  });
  updateCounters();
}

/* ---------- 启动 ---------- */
if (matchMedia('(max-width:760px)').matches) $('#stats').open = false;
const list = $('#list');
const frag = document.createDocumentFragment();
(async () => {
  await pullState();
  [...POSTS].forEach(p => {
    const c = buildCard(p);
    c._p = p;
    frag.append(c);
  });
  list.append(frag);
  applyFilter();
  booting = false;
})();

renderDates();

['q', 'f-score', 'f-date'].forEach(id => $('#' + id).addEventListener('input', applyFilter));
$('#f-sort').addEventListener('change', () => {
  const mode = $('#f-sort').value;
  const arr = [...visiblePosts()].sort((a, b) => {
    if (mode === 'score') return (scoreOf(b.id) ?? -1) - (scoreOf(a.id) ?? -1);
    if (mode === 'views') return (b.views || 0) - (a.views || 0);
    return a.ts - b.ts;
  });
  list.replaceChildren(...arr.map(p => document.querySelector(`.card[data-id="${p.id}"]`)).filter(Boolean));
  applyFilter();
});

// 按展示补分：用满 1–10 分，展示每上一个档位升一分；已评的不动。
const VIEW_RULE = [
  [1000000, 10, '≥100 万'], [500000, 9, '50–100 万'], [200000, 8, '20–50 万'],
  [100000, 7, '10–20 万'], [50000, 6, '5–10 万'], [10000, 5, '1–5 万'],
  [1000, 4, '1000–1 万'], [100, 3, '100–1000'], [10, 2, '10–100'], [0, 1, '<10'],
];
const viewScore = v => (VIEW_RULE.find(([lo]) => v >= lo) || [0, 1])[1];

$('#autofill').addEventListener('click', () => {
  const pending = visiblePosts().filter(p => scoreOf(p.id) === null);
  if (!pending.length) { toast('没有未评分的帖子了'); return; }
  const v = p => Number(p.views) || 0;
  const dist = {};
  pending.forEach(p => { const s = viewScore(v(p)); dist[s] = (dist[s] || 0) + 1; });
  const lines = VIEW_RULE.filter(([, s]) => dist[s])
    .map(([, s, label]) => `${label} → ${s} 分：${dist[s]} 条`).join('\n');
  if (!confirm(`给剩下 ${pending.length} 条按展示补分？\n\n${lines}`)) return;
  pending.forEach(p => { st[p.id] = viewScore(v(p)); });
  save();
  document.querySelectorAll('.card').forEach(c => c.refresh && c.refresh());
  applyFilter();
  toast(`已补 ${pending.length} 条`);
});

const rowsForSave = () => POSTS.filter(p => scoreOf(p.id) !== null).map(p => ({ id: p.id, score: scoreOf(p.id) }));

// 只有 site/serve.py 提供 POST /save；静态托管（Cloudflare Pages）上隐藏，避免点了报 404
if (!['127.0.0.1', 'localhost'].includes(location.hostname)) $('#save').hidden = true;
$('#save').addEventListener('click', async () => {
  const rows = rowsForSave();
  if (!rows.length) { toast('还没有评分', true); return; }
  try {
    const r = await fetch('/save?name=target-ratings.json', { method: 'POST', body: JSON.stringify(rows) });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    toast(`已写入 ${j.saved}（${j.rows} 条）`);
  } catch (e) {
    toast('保存失败：服务没开写入口，请用「导出评分」', true);
  }
});

$('#export').addEventListener('click', () => {
  const out = POSTS.filter(p => scoreOf(p.id) !== null).map(p => ({ id: p.id, score: scoreOf(p.id) }));
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'target-ratings.json'; a.click();
  URL.revokeObjectURL(a.href);
  toast(`已导出 ${out.length} 条`);
});

$('#import').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async () => {
  const f = $('#file').files[0]; if (!f) return;
  try {
    const rows = JSON.parse(await f.text());
    rows.forEach(r => { if (r && r.id && typeof r.score === 'number') st[r.id] = r.score; });
    save(); await pushState(); toast(`已导入 ${rows.length} 条`); setTimeout(() => location.reload(), 500);
  } catch (e) { toast('导入失败：不是合法 JSON', true); }
});

$('#reset').addEventListener('click', async () => {
  if (!confirm('清空所有评分？线上记录也会清空。')) return;
  localStorage.removeItem(KEY);
  try {
    const r = await fetch(SYNC, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ratings: {}, replace: true }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  } catch (e) {
    toast('线上评分没清掉，下次打开会回来', true);
  }
  location.reload();
});
</script>
</body>
</html>
