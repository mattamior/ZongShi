<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026-11-09 稿池 · 审稿台</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c232c;--line:#2a323d;--fg:#e6edf3;--dim:#8b949e;
--ok:#3fb950;--no:#f85149;--edit:#d29922;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
.counters{display:flex;gap:14px;margin-left:auto;font-size:13px;color:var(--dim)}
.counters b{color:var(--fg);font-weight:600}
.counters .u b{color:var(--ok)}.counters .r b{color:var(--no)}.counters .e b{color:var(--edit)}.counters .d b{color:#a371f7}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-size:13px;cursor:pointer}
button:hover{border-color:#3d4856;background:#222b35}
button.primary{background:#1f6feb;border-color:#1f6feb}
button.primary:hover{background:#2b7bf5}
input[type=search],select{background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:13px;min-width:120px}
input[type=search]{flex:1;min-width:200px}
.chk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:18px 20px 80px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;outline:none;transition:border-color .12s,opacity .12s}
.card:focus{border-color:var(--acc)}
.card.used{border-color:rgba(63,185,80,.6)}
.card.rejected{opacity:.42}
.card.dup{border-color:rgba(163,113,247,.55);opacity:.66}
.card.rejected .text{text-decoration:line-through}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--dim)}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg);font-weight:600}
.badge{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--dim)}
.badge.a{color:#79c0ff;border-color:#1f4b7a}
.badge.b{color:#d2a8ff;border-color:#4b3a6b}
.badge.t{color:#7ee787;border-color:#2a5b33}
.state{margin-left:auto;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.state.used{color:var(--ok);border-color:rgba(63,185,80,.5)}
.state.rejected{color:var(--no);border-color:rgba(248,81,73,.5)}
.state.edited{color:var(--edit);border-color:rgba(210,153,34,.5)}
.state.dup{color:#a371f7;border-color:rgba(163,113,247,.5)}
.body{display:flex;gap:18px;align-items:flex-start}
.textcol{flex:1;min-width:0}
.text{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.75}
.editor{width:100%;min-height:120px;background:#0b0f14;color:var(--fg);border:1px solid var(--acc);border-radius:6px;padding:10px;font:inherit;white-space:pre-wrap;resize:vertical}
.imgcol{width:300px;flex:0 0 300px;display:flex;flex-direction:column;gap:8px}
.imgcol[hidden]{display:none}
.thumb{width:100%;border-radius:8px;border:1px solid var(--line);display:block;background:#0b0f14;max-height:260px;object-fit:cover}
.thumb[hidden]{display:none}
.imgcredit{font-size:11px;color:var(--dim);line-height:1.4}
.imgcredit[hidden]{display:none}
.imgbtns{display:flex;gap:6px;flex-wrap:wrap}
.imgbtns button{font-size:12px;padding:4px 9px}
.empty{font-size:12px;color:var(--dim);border:1px dashed var(--line);border-radius:8px;padding:18px 10px;text-align:center}
.srcrow{margin-top:10px;font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:baseline;min-height:18px}
.srcrow a{color:var(--acc);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow a:hover{text-decoration:underline}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{border-radius:6px}
.ok{color:var(--ok);border-color:rgba(63,185,80,.45)}
.ok:hover{background:rgba(63,185,80,.12)}
.no{color:var(--no);border-color:rgba(248,81,73,.45)}
.no:hover{background:rgba(248,81,73,.12)}
.dup{color:#a371f7;border-color:rgba(163,113,247,.45)}
.dup:hover{background:rgba(163,113,247,.12)}
.edit{color:var(--edit);border-color:rgba(210,153,34,.45)}
.edit:hover{background:rgba(210,153,34,.12)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#238636;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}
#toast.err{background:#b62324}
.kbd{font-size:11.5px;color:var(--dim)}
@media(max-width:760px){.imgcol{width:140px;flex:0 0 140px}.text{font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>2026-11-09 稿池 · 审稿台</h1>
    <span class="kbd">j/k 切换 · c 复制 · d 重复 · x 废弃 · e 编辑</span>
    <div class="counters">
      <span>总 <b id="c-total">0</b></span>
      <span>显示 <b id="c-shown">0</b></span>
      <span class="u">已用 <b id="c-used">0</b></span>
      <span class="r">废弃 <b id="c-rej">0</b></span>
      <span class="e">已改 <b id="c-edit">0</b></span>
      <span class="d">重复 <b id="c-dup">0</b></span>
      <span>未处理 <b id="c-pend">0</b></span>
    </div>
  </div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="搜正文 / 编号 / 来源">
    <select id="f-acc"><option value="">全部账号</option><option value="A">号 A</option><option value="B">号 B</option></select>
    <select id="f-state"><option value="">全部状态</option><option value="pending">未处理</option><option value="used">已用</option><option value="rejected">废弃</option><option value="duplicate">重复</option><option value="edited">已改</option></select>
    <select id="f-origin"><option value="">全部来源</option><option value="选定">选定</option><option value="备选">备选</option><option value="池">池</option></select>
    <select id="f-tag"><option value="">全部题材</option></select>
    <select id="f-hour"><option value="">全部时段</option></select>
    <label class="chk" title="按主题去重后，同一主题只留 2 条"><input type="checkbox" id="hide-dup" checked> 隐藏重复</label>
    <button id="copy-used">复制已用文本</button>
    <button id="export">导出结果</button>
    <button id="reset">重置</button>
  </div>
</header>
<main id="list"></main>

de": "问句", "text": "领导说「好好干，不会亏待你」\n\n这话听了三年，涨薪五百\n\n亏待的标准是多少？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b175", "account": "B", "slot": "19:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "画饼的时候眼睛都不眨\n\n兑现的时候开始讲困难\n\n这戏演给谁看？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b176", "account": "B", "slot": "19:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "text": "团建、奋斗、一家人\n\n三个词凑齐，就要加班了\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b177", "account": "A", "slot": "15:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "退租押金拖了两个月\n\n房东说在算水电\n\n算到哪年了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b178", "account": "A", "slot": "15:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "租房合同写着「自然损耗不扣押金」\n\n退房时墙上一道印子扣三百\n\n自然损耗谁说了算？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b179", "account": "B", "slot": "15:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "押一付三，中介费半个月\n\n进个门先掏一万\n\n这钱花得值吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b180", "account": "B", "slot": "15:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "房东说周边都涨了，我也涨两百\n\n周边跌的时候怎么不说？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b181", "account": "A", "slot": "15:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "房租一年一涨，工资三年没动\n\n这市场是谁在撑着？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b182", "account": "A", "slot": "15:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "text": "合同到期前一个月，房东突然热情\n\n热情完就是涨价\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b183", "account": "B", "slot": "15:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "物业费一分不少，电梯坏了修三天\n\n这钱交的是什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b184", "account": "B", "slot": "15:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "text": "小区群里最积极的永远是催缴费的\n\n报修的时候没人回\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b185", "account": "A", "slot": "15:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "物业说预算不够\n\n不够还每年换一次大门\n\n钱花哪儿了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b186", "account": "A", "slot": "15:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "外卖配送费涨到六块，包装费另算\n\n饭没吃，先付十块\n\n这钱进了谁口袋？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b187", "account": "B", "slot": "15:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "点了份二十块的饭，配送费八块\n\n骑手到手几块，平台抽几块？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b188", "account": "B", "slot": "15:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "下雨天配送费翻倍，骑手说没多拿\n\n那多出来的钱呢？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b189", "account": "A", "slot": "15:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "快递放驿站算我同意了吗\n\n不送上门还有理了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b190", "account": "A", "slot": "15:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "驿站九点关门，我九点半下班\n\n这时间是谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b191", "account": "B", "slot": "15:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "快递柜超时收费，一天一块五\n\n我不在家，怪我？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b192", "account": "B", "slot": "15:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "满 300 减 50，永远差 12 块\n\n这 12 块是算法留的吧？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b193", "account": "A", "slot": "14:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "先涨后降，双十一的价签比变脸快\n\n原价谁见过？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b194", "account": "A", "slot": "14:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "预付定金、尾款、跨店满减\n\n算完一小时，省了八块\n\n值得吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b195", "account": "B", "slot": "14:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "text": "信用卡分期，手续费说「低至」零点几\n\n算成年化多少，客服不肯说\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b196", "account": "B", "slot": "14:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "银行打电话让我办分期，说对我好\n\n对我好还收我钱？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b197", "account": "A", "slot": "14:15", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "最低还款，利息按全额算\n\n这规则写在哪一行？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b198", "account": "A", "slot": "14:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "健身房年卡三千，去了四次\n\n平均一次七百五\n\n谁在赚这个钱？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b199", "account": "B", "slot": "14:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "办卡的时候说随时退\n\n退的时候说要扣 30%\n\n随时是哪个随时？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b200", "account": "B", "slot": "14:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "健身房越开越多，人越来越少\n\n靠什么活着？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b201", "account": "A", "slot": "14:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "理发师说办卡打五折\n\n不办卡的原价谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b202", "account": "A", "slot": "14:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "text": "剪个头发，被推销了半小时头皮护理\n\n我只想剪短\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b203", "account": "B", "slot": "14:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "办卡那家店，三个月后换招牌了\n\n卡里的钱找谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b204", "account": "B", "slot": "14:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "教练说我核心太弱，得买二十节课\n\n买完他跳槽了\n\n这钱退不退？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b205", "account": "A", "slot": "14:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "体测报告一堆红字\n\n红字是仪器给的，还是业绩给的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b206", "account": "A", "slot": "14:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "私教课一节四百，教我用器械\n\n视频里免费的东西\n\n谁在交智商税？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b207", "account": "B", "slot": "14:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "专家号一号难求，黄牛加价三百\n\n黄牛的号从哪来的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b208", "account": "B", "slot": "14:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "凌晨四点排队，前面二十个是代排\n\n这队还排得下去吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b209", "account": "A", "slot": "13:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "挂号系统说无号，黄牛说他有\n\n系统是谁家的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b210", "account": "A", "slot": "13:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "体检套餐从三百加到三千\n\n加的项目，医生看吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b211", "account": "B", "slot": "13:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "体检报告写「建议复查」\n\n复查完说没事\n\n那第一次是吓谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b212", "account": "B", "slot": "13:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "体检中心比医院装修好\n\n查出问题还得回医院\n\n它到底查什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b213", "account": "A", "slot": "13:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "孩子作业要家长批，家长群要家长回\n\n老师的活谁干？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b214", "account": "A", "slot": "13:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "家长群里，老师发通知，家长排队「收到」\n\n收到之后谁看？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b215", "account": "B", "slot": "13:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "text": "双减之后，作业变成了「实践活动」\n\n家长更忙了\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b216", "account": "B", "slot": "13:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "学区房一平贵两万，就为个名额\n\n名额是谁划的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b217", "account": "A", "slot": "13:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "补习班关了，一对一贵了三倍\n\n减负减到谁头上？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b218", "account": "A", "slot": "13:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "买学区房的家长，赌的是政策不变\n\n政策敢承诺几年？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b219", "account": "B", "slot": "13:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "考公报名两百万人，招两万\n\n剩下的去哪？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b220", "account": "B", "slot": "13:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "考研三年，出来还是投简历\n\n这三年算投资还是算躲？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b221", "account": "A", "slot": "13:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "培训机构说「上岸率 80%」\n\n统计的是报了班的还是没退费的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b222", "account": "A", "slot": "13:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "面试问「你能接受加班吗」\n\n答能，入职后天天加\n\n这算骗吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b223", "account": "B", "slot": "13:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "试用期六个月，工资打八折\n\n这合法吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b224", "account": "B", "slot": "13:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "text": "HR 说我们弹性很大\n\n弹的是下班时间\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b225", "account": "A", "slot": "08:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "年终奖发了个「感谢信」\n\n信里说共渡难关\n\n难关是谁的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b226", "account": "A", "slot": "08:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "工资十年涨了两千，房价涨了两万\n\n谁跑赢了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b227", "account": "B", "slot": "08:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "同事离职前问：涨薪什么时候\n\n领导说「看年底」\n\n年底到了吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b228", "account": "B", "slot": "08:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "相亲第一句问房子，第二句问车\n\n第三句问父母退休金\n\n这是找对象还是查资产？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b229", "account": "A", "slot": "08:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "彩礼从八万涨到十八万\n\n涨价的依据是什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b230", "account": "A", "slot": "08:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "介绍人说对方条件好\n\n条件好的人为什么还要相亲？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b231", "account": "B", "slot": "08:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "过年被问工资、对象、买房\n\n回答完还得被比较\n\n这饭非吃不可吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b232", "account": "B", "slot": "08:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "亲戚说「为你好」\n\n为我好能不能先借我点钱？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b233", "account": "A", "slot": "08:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "一年见一次，问的都是隐私\n\n这叫关心？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b234", "account": "A", "slot": "08:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "同学群三年没说话，一说话就是卖货\n\n这感情值多少钱？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b235", "account": "B", "slot": "08:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "群发的祝福，连名字都不改\n\n我要的是祝福还是群发？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b236", "account": "B", "slot": "08:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "同学会，混得好的坐主桌\n\n谁定的座次？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b237", "account": "A", "slot": "08:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "直播间喊「家人们」，一晚上卖一个亿\n\n家人有这么贵？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b238", "account": "A", "slot": "08:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "砍一刀，差 0.01 元\n\n这 0.01 元砍了三天\n\n谁设计的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b239", "account": "B", "slot": "08:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "主播说全网最低价\n\n比完价发现贵二十\n\n最低是跟谁比？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b240", "account": "B", "slot": "08:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "打车显示 28，下车收 41\n\n多出来的是堵车还是算法？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b241", "account": "A", "slot": "07:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "高峰期加价一倍，司机说没多拿\n\n那加给谁了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b242", "account": "A", "slot": "07:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "网约车说「为您匹配最近车辆」\n\n三公里外也叫最近？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b243", "account": "B", "slot": "07:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "地铁安检，水要喝一口\n\n喝给谁看？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b244", "account": "B", "slot": "07:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "早高峰限流，排队二十分钟\n\n这城市到底装得下多少人？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b245", "account": "A", "slot": "07:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "通勤两小时，上班八小时\n\n一天有几个自己？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b246", "account": "A", "slot": "07:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "电梯里一周换三次广告\n\n住了三年只记住「整容分期」\n\n这投放算成功吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b247", "account": "B", "slot": "07:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "物业费涨了，电梯广告收入呢？\n\n公示过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b248", "account": "B", "slot": "07:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "电梯广告说「0 利息」\n\n0 利息靠什么赚？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b249", "account": "A", "slot": "07:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "停车十分钟，罚单两百\n\n这十分钟值两百？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b250", "account": "A", "slot": "07:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "车位卖三十万，租一个月八百\n\n哪个更划算，算过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b251", "account": "B", "slot": "07:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "路边停车位画了又擦，擦了又画\n\n画的依据是什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b252", "account": "B", "slot": "07:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "遛狗不牵绳，说「它不咬人」\n\n咬了算谁的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b253", "account": "A", "slot": "07:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "小区禁养大型犬，公告贴了三年\n\n谁在执行？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b254", "account": "A", "slot": "07:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "宠物医院比人医院贵\n\n狗看病五百，人看病五十\n\n这定价谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b255", "account": "B", "slot": "07:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "景区门票一百二，进去全是商店\n\n看景还是看店？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b256", "account": "B", "slot": "07:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "古镇修得一模一样\n\n换个城市还是那条街\n\n这算旅游吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b257", "account": "A", "slot": "06:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "门票预约、观光车、索道另收费\n\n一张票到底包什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b258", "account": "A", "slot": "06:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "中介说「这价已经到底了」\n\n到底之后又降了十万\n\n到底是谁的底？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b259", "account": "B", "slot": "06:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "二手房挂半年没人问，中介让降二十万\n\n降的钱是谁的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b260", "account": "B", "slot": "06:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "看房时说的学区、地铁、规划\n\n哪一条能写进合同？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b261", "account": "A", "slot": "06:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "加班到十点，打车费不报\n\n说「年轻人别计较」\n\n那计较的人去哪了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b262", "account": "A", "slot": "06:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "领导说今天不加班\n\n六点开会到八点\n\n这叫不加班？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b263", "account": "B", "slot": "06:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "周末团建算不算上班？\n\n不去扣绩效\n\n这算自愿？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b264", "account": "B", "slot": "06:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "「公司上市就财务自由」\n\n上市三年了\n\n自由的是谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b265", "account": "A", "slot": "06:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "老板说共渡难关\n\n难关过了，奖金呢？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b266", "account": "A", "slot": "06:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "谈情怀的时候不谈钱\n\n谈钱的时候说情怀\n\n这套组合拳谁发明的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b267", "account": "B", "slot": "06:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "text": "中介费一个月房租\n\n带看两套\n\n这钱赚得比我容易\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b268", "account": "B", "slot": "06:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "合同写「家电齐全」\n\n冰箱不制冷，洗衣机漏水\n\n齐全的标准是能通电？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b269", "account": "A", "slot": "06:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "合租房，隔断墙薄得像纸\n\n隔壁打呼我听得见\n\n这合法吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b270", "account": "A", "slot": "06:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "房东说「我这房子不愁租」\n\n空了两个月\n\n不愁的是嘴？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b271", "account": "B", "slot": "06:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "涨租通知发在群里，@所有人\n\n不同意就搬\n\n这算协商？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b272", "account": "B", "slot": "06:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "中介说房价到底了\n\n第二天同户型降五万\n\n到底是谁的底？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b273", "account": "A", "slot": "23:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "物业费按建筑面积收\n\n公摊也算钱\n\n服务按公摊给吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b274", "account": "A", "slot": "23:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "电梯坏了，说要动用维修基金\n\n基金账本见过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b275", "account": "B", "slot": "23:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "小区停车费涨了\n\n业主大会开过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b276", "account": "B", "slot": "23:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "配送费涨价，说给骑手\n\n骑手说没收到\n\n钱呢？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b277", "account": "A", "slot": "23:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "点餐必须选「准时宝」\n\n迟到赔三块\n\n这保险谁在赚？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b278", "account": "A", "slot": "23:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "商家说平台抽成 22%\n\n平台说给流量\n\n流量值 22%？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b279", "account": "B", "slot": "23:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "快递不送上门，投诉就拉黑\n\n谁给的权力？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b280", "account": "B", "slot": "23:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "驿站代收，丢件谁赔？\n\n说查监控\n\n监控坏了一年了\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b281", "account": "A", "slot": "23:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "生鲜放驿站一下午\n\n坏了算谁的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b282", "account": "A", "slot": "23:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "预售比现货贵\n\n退定金要等七天\n\n这算优惠？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b283", "account": "B", "slot": "23:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "text": "满减凑单，凑完发现单价更高\n\n算法比我会算\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b284", "account": "B", "slot": "23:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "text": "保价 15 天\n\n第 16 天降价\n\n卡得真准\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b285", "account": "A", "slot": "23:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "text": "客服说分期「免息」\n\n免的是利息，收的是手续费\n\n换汤不换药\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b286", "account": "A", "slot": "23:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "最低还款，利息按全额\n\n银行不会主动说\n\n合同哪一页？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b287", "account": "B", "slot": "23:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "text": "办卡送行李箱\n\n年费三百\n\n箱子值三十\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b288", "account": "B", "slot": "23:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "text": "年卡到期前一个月，销售开始热情\n\n热情的是续费\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b289", "account": "A", "slot": "05:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "私教说「你这种体态再不练就废了」\n\n废了还能上班吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b290", "account": "A", "slot": "05:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "健身房跑路，会员群变维权群\n\n预付费谁监管？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b291", "account": "B", "slot": "05:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "剪发 38，总监 128\n\n剪出来一模一样\n\n差在头衔？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b292", "account": "B", "slot": "05:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "办卡时说随时退\n\n退时说活动价不退\n\n活动是谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b293", "account": "A", "slot": "05:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "教练让买 30 节课\n\n说能瘦 20 斤\n\n合同敢写吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b294", "account": "A", "slot": "05:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "体测仪打印一张纸\n\n说体脂 28%\n\n这机器校准过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b295", "account": "B", "slot": "05:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "挂号黄牛说「内部号」\n\n内部是谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b296", "account": "B", "slot": "05:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "演唱会门票秒没\n\n黄牛手里一堆\n\n票从哪来的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b297", "account": "A", "slot": "05:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "专家号 300，黄牛 800\n\n多出来的 500 买的是什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b298", "account": "A", "slot": "05:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "体检套餐越贵，项目越多\n\n医生看得过来吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b299", "account": "B", "slot": "05:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "体检报告建议复查\n\n复查花钱，结果没事\n\n第一次是误诊？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b300", "account": "B", "slot": "05:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "公司体检，报告先给 HR？\n\n隐私谁保护？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b301", "account": "A", "slot": "05:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "老师发通知，家长排队「收到」\n\n收到有什么用？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b302", "account": "A", "slot": "05:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "text": "家长群变成夸夸群\n\n谁先夸谁尴尬\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b303", "account": "B", "slot": "05:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "作业让家长批\n\n老师改什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b304", "account": "B", "slot": "05:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "学区房降价了\n\n学区还在吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b305", "account": "A", "slot": "04:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "补习班转地下，一对一更贵\n\n减负减给谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b306", "account": "A", "slot": "04:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "名校分校开到家门口\n\n师资是本部来的吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b307", "account": "B", "slot": "04:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "考公三不限岗位，两千人抢一个\n\n图什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b308", "account": "B", "slot": "04:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "上岸第一年，工资四千\n\n说稳定\n\n稳定能买房吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b309", "account": "A", "slot": "04:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "考研二战三战\n\n家里出钱\n\n这算啃老吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b310", "account": "A", "slot": "04:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "面试问婚育计划\n\n这是招人还是查户口？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b311", "account": "B", "slot": "04:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "试用期不交社保\n\n说转正补\n\n补得了吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b312", "account": "B", "slot": "04:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "text": "简历写「抗压能力强」\n\n入职发现是加班多\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b313", "account": "A", "slot": "04:30", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "工资条上基本工资两千\n\n剩下全是绩效\n\n请假扣哪部分？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b314", "account": "A", "slot": "04:30", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "text": "年终奖发购物卡\n\n说等同现金\n\n卡只能在一家店花\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b315", "account": "B", "slot": "04:30", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "涨薪 5%，房租涨 10%\n\n这叫涨薪？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b316", "account": "B", "slot": "04:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "text": "相亲对象问「你有房吗」\n\n我说有贷款\n\n对方说那不算\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b317", "account": "A", "slot": "04:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "介绍人把 35 岁说成 30 岁\n\n见面怎么解释？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b318", "account": "A", "slot": "04:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "彩礼谈崩，感情也崩\n\n这婚是结给谁看的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b319", "account": "B", "slot": "04:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "text": "亲戚借钱，说「一家人」\n\n还钱时变「最近紧」\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b320", "account": "B", "slot": "04:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "过年红包，给多给少都有人说\n\n标准谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b321", "account": "A", "slot": "03:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "text": "同学群发链接砍价\n\n砍完就没人说话\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b322", "account": "A", "slot": "03:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "同学聚会 AA，组织者多收两百\n\n说场地费\n\n账单呢？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b323", "account": "B", "slot": "03:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "text": "主播说「最后三单」\n\n喊了一小时\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b324", "account": "B", "slot": "03:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "直播间抽奖，中奖的是内部号？\n\n名单敢公示吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b325", "account": "A", "slot": "03:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "带货翻车，主播说 333", "account": "A", "slot": "03:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "路边停车收费员手写发票\n\n这钱进财政吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b334", "account": "A", "slot": "03:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "狗证办了，遛狗还是不牵绳\n\n罚过谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b335", "account": "B", "slot": "03:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "text": "宠物殡葬一次两千\n\n比人还贵\n\n这市场谁定的价？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b336", "account": "B", "slot": "03:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "text": "景区门票降了，观光车涨了\n\n总价没变\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b337", "account": "A", "slot": "02:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "古镇免费，停车 50\n\n羊毛出在谁身上？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b338", "account": "A", "slot": "02:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "text": "网红打卡点排队两小时\n\n拍照五分钟\n\n值吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b339", "account": "B", "slot": "02:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "中介带看十套，一套没成\n\n要收「带看费」？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b340", "account": "B", "slot": "02:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "text": "中介说「业主急售」\n\n急的是业主还是中介？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b341", "account": "A", "slot": "02:15", "origin": "池", "tag": "人情", "type": "日常观察", "mode": "问句", "text": "份子钱从 200 涨到 800\n\n工资涨了吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b342", "account": "A", "slot": "02:15", "origin": "池", "tag": "人情", "type": "日常观察", "mode": "问句", "text": "同事结婚随 500\n\n我结婚他没来\n\n这账怎么算？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b343", "account": "B", "slot": "02:15", "origin": "池", "tag": "教育", "type": "日常观察", "mode": "问句", "text": "宿舍装空调要学生摊钱\n\n学费里没有？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b344", "account": "B", "slot": "02:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "text": "实习没工资，说「学经验」\n\n经验能交房租吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b345", "account": "A", "slot": "02:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "text": "副业课 999\n\n教你怎么月入过万\n\n他自己靠卖课月入过万\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b346", "account": "A", "slot": "02:30", "origin": "池", "tag": "就业", "type": "日常观察", "mode": "问句", "text": "摆摊被劝离，说影响市容\n\n那夜市怎么又让摆了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b347", "account": "B", "slot": "02:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "text": "短视频说「三招教你财富自由」\n\n第三招是卖课\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b348", "account": "B", "slot": "02:30", "origin": "池", "tag": "民生", "type": "日常 const list = $('#list');
const frag = document.createDocumentFragment();
for (const p of POSTS) frag.append(buildCard(p));
list.append(frag);
applyFilter();

$('#copy-used').addEventListener('click', async () => {
  const parts = POSTS.filter(p => stateName(p.id)[0] === 'used').map(p => currentText(p));
  if (!parts.length) { toast('还没有标记为已用的帖子', true); return; }
  try { await navigator.clipboard.writeText(parts.join('\n\n')); toast(`已复制 ${parts.length} 条`); }
  catch (e) { toast('复制失败', true); }
});
$('#export').addEventListener('click', () => {
  const out = POSTS.map(p => {
    const r = rec(p.id);
    const [cls] = stateName(p.id);
    return { id: p.id, account: p.account, slot: p.slot, tag: p.tag, state: cls, text: currentText(p), edited: r.text != null, has_image: !!r.image };
  });
  const blob = new Blob([JSON.stringify({ date: '2026-11-09', items: out }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'review-2026-11-09.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('已导出 review-2026-11-09.json');
});
$('#reset').addEventListener('click', () => {
  if (!confirm('清空本地的已用/废弃/修改记录？')) return;
  st = {}; save(); location.reload();
});

let cursor = -1;
const visible = () => [...list.children].filter(c => !c.hidden);
document.addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  const cards = visible(); if (!cards.length) return;
  if (e.key === 'j' || e.key === 'k') {
    cursor = Math.max(0, Math.min(cards.length - 1, cursor + (e.key === 'j' ? 1 : -1)));
    cards[cursor].focus(); cards[cursor].scrollIntoView({block:'center', behavior:'smooth'});
  } else if (e.key === 'c') { cards[Math.max(cursor,0)]?.querySelector('.ok').click(); }
  else if (e.key === 'd') { cards[Math.max(cursor,0)]?.querySelector('.dup').click(); }
  else if (e.key === 'x') { cards[Math.max(cursor,0)]?.querySelector('.no').click(); }
  else if (e.key === 'e') { cards[Math.max(cursor,0)]?.querySelector('.edit').click(); }
});
updateCounters();
</script>
</body>
</html>
