in": "池", "tag": "电竞", "type": "热点跟评", "mode": "问句", "chars": 29, "text": "输给 LPL 就被叫好兄弟\n\n他本人知道吗？\n\n@grok", "source_title": "多兰 LPL的好兄弟", "source_url": "https://www.baidu.com/s?wd=%E5%A4%9A%E5%85%B0%20LPL%E7%9A%84%E5%A5%BD%E5%85%84%E5%BC%9F", "image": "img/n077.jpg", "image_credit": "百度图片", "image_origin": "search", "preset": null}, {"id": "b169", "date": "2026-11-09", "slot": "19:30", "origin": "池", "tag": "天气", "type": "热点跟评", "mode": "问句", "chars": 36, "text": "最强厄尔尼诺来了\n\n去年说最冷，今年说最热\n\n到底听谁的？\n\n@grok", "source_title": "最强厄尔尼诺来了 这个冬天怎么过", "source_url": "https://www.baidu.com/s?wd=%E6%9C%80%E5%BC%BA%E5%8E%84%E5%B0%94%E5%B0%BC%E8%AF%BA%E6%9D%A5%E4%BA%86%20%E8%BF%99%E4%B8%AA%E5%86%AC%E5%A4%A9%E6%80%8E%E4%B9%88%E8%BF%87", "image": "img/n091.jpg", "image_credit": "百度图片", "image_origin": "search", "preset": null}, {"id": "b170", "date": "2026-11-09", "slot": "19:30", "origin": "池", "tag": "天气", "type": "热点跟评", "mode": "问句", "chars": 33, "text": "每年都「最强」\n\n这词跟「重大突破」是一个编辑部吧？\n\n@grok", "source_title": "最强厄尔尼诺来了 这个冬天怎么过", "source_url": "https://www.baidu.com/s?wd=%E6%9C%80%E5%BC%BA%E5%8E%84%E5%B0%94%E5%B0%BC%E8%AF%BA%E6%9D%A5%E4%BA%86%20%E8%BF%99%E4%B8%AA%E5%86%AC%E5%A4%A9%E6%80%8E%E4%B9%88%E8%BF%87", "image": "img/n091.jpg", "image_credit": "百度图片", "image_origin": "search", "preset": null}, {"id": "b171", "date": "2026-11-09", "slot": "19:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 33, "text": "加班到十一点，群里还在发「收到」\n\n这班是给谁上的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b172", "date": "2026-11-09", "slot": "19:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 38, "text": "周报写了三页，领导看没看不知道\n\n不看也得写\n\n这规矩谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b173", "date": "2026-11-09", "slot": "19:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "chars": 30, "text": "公司说弹性工作制\n\n弹性的是我，工作制是固定的\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b174", "date": "2026-11-09", "slot": "19:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 45, "text": "领导说「好好干，不会亏待你」\n\n这话听了三年，涨薪五百\n\n亏待的标准是多少？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b175", "date": "2026-11-09", "slot": "19:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 38, "text": "画饼的时候眼睛都不眨\n\n兑现的时候开始讲困难\n\n这戏演给谁看？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b176", "date": "2026-11-09", "slot": "19:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "chars": 29, "text": "团建、奋斗、一家人\n\n三个词凑齐，就要加班了\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b177", "date": "2026-11-09", "slot": "15:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 33, "text": "退租押金拖了两个月\n\n房东说在算水电\n\n算到哪年了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b178", "date": "2026-11-09", "slot": "15:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 48, "text": "租房合同写着「自然损耗不扣押金」\n\n退房时墙上一道印子扣三百\n\n自然损耗谁说了算？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b179", "date": "2026-11-09", "slot": "15:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 36, "text": "押一付三，中介费半个月\n\n进个门先掏一万\n\n这钱花得值吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b180", "date": "2026-11-09", "slot": "15:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 34, "text": "房东说周边都涨了，我也涨两百\n\n周边跌的时候怎么不说？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b181", "date": "2026-11-09", "slot": "15:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 31, "text": "房租一年一涨，工资三年没动\n\n这市场是谁在撑着？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b182", "date": "2026-11-09", "slot": "15:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "chars": 31, "text": "合同到期前一个月，房东突然热情\n\n热情完就是涨价\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b183", "date": "2026-11-09", "slot": "15:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 32, "text": "物业费一分不少，电梯坏了修三天\n\n这钱交的是什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b184", "date": "2026-11-09", "slot": "15:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "chars": 32, "text": "小区群里最积极的永远是催缴费的\n\n报修的时候没人回\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b185", "date": "2026-11-09", "slot": "15:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 34, "text": "物业说预算不够\n\n不够还每年换一次大门\n\n钱花哪儿了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b186", "date": "2026-11-09", "slot": "15:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 42, "text": "外卖配送费涨到六块，包装费另算\n\n饭没吃，先付十块\n\n这钱进了谁口袋？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b187", "date": "2026-11-09", "slot": "15:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 36, "text": "点了份二十块的饭，配送费八块\n\n骑手到手几块，平台抽几块？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b188", "date": "2026-11-09", "slot": "15:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 32, "text": "下雨天配送费翻倍，骑手说没多拿\n\n那多出来的钱呢？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b189", "date": "2026-11-09", "slot": "15:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 29, "text": "快递放驿站算我同意了吗\n\n不送上门还有理了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b190", "date": "2026-11-09", "slot": "15:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 30, "text": "驿站九点关门，我九点半下班\n\n这时间是谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b191", "date": "2026-11-09", "slot": "15:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 30, "text": "快递柜超时收费，一天一块五\n\n我不在家，怪我？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b192", "date": "2026-11-09", "slot": "15:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 41, "text": "满 300 减 50，永远差 12 块\n\n这 12 块是算法留的吧？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b193", "date": "2026-11-09", "slot": "14:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 30, "text": "先涨后降，双十一的价签比变脸快\n\n原价谁见过？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b194", "date": "2026-11-09", "slot": "14:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 37, "text": "预付定金、尾款、跨店满减\n\n算完一小时，省了八块\n\n值得吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b195", "date": "2026-11-09", "slot": "14:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "chars": 38, "text": "信用卡分期，手续费说「低至」零点几\n\n算成年化多少，客服不肯说\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b196", "date": "2026-11-09", "slot": "14:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 32, "text": "银行打电话让我办分期，说对我好\n\n对我好还收我钱？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b197", "date": "2026-11-09", "slot": "14:15", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 29, "text": "最低还款，利息按全额算\n\n这规则写在哪一行？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b198", "date": "2026-11-09", "slot": "14:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 37, "text": "健身房年卡三千，去了四次\n\n平均一次七百五\n\n谁在赚这个钱？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b199", "date": "2026-11-09", "slot": "14:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 39, "text": "办卡的时候说随时退\n\n退的时候说要扣 30%\n\n随时是哪个随时？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b200", "date": "2026-11-09", "slot": "14:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 28, "text": "健身房越开越多，人越来越少\n\n靠什么活着？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b201", "date": "2026-11-09", "slot": "14:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 28, "text": "理发师说办卡打五折\n\n不办卡的原价谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b202", "date": "2026-11-09", "slot": "14:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "chars": 30, "text": "剪个头发，被推销了半小时头皮护理\n\n我只想剪短\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b203", "date": "2026-11-09", "slot": "14:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 30, "text": "办卡那家店，三个月后换招牌了\n\n卡里的钱找谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b204", "date": "2026-11-09", "slot": "14:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 38, "text": "教练说我核心太弱，得买二十节课\n\n买完他跳槽了\n\n这钱退不退？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b205", "date": "2026-11-09", "slot": "14:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 32, "text": "体测报告一堆红字\n\n红字是仪器给的，还是业绩给的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b206", "date": "2026-11-09", "slot": "14:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 39, "text": "私教课一节四百，教我用器械\n\n视频里免费的东西\n\n谁在交智商税？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b207", "date": "2026-11-09", "slot": "14:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 32, "text": "专家号一号难求，黄牛加价三百\n\n黄牛的号从哪来的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b208", "date": "2026-11-09", "slot": "14:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 33, "text": "凌晨四点排队，前面二十个是代排\n\n这队还排得下去吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b209", "date": "2026-11-09", "slot": "13:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 29, "text": "挂号系统说无号，黄牛说他有\n\n系统是谁家的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b210", "date": "2026-11-09", "slot": "13:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 30, "text": "体检套餐从三百加到三千\n\n加的项目，医生看吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b211", "date": "2026-11-09", "slot": "13:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 36, "text": "体检报告写「建议复查」\n\n复查完说没事\n\n那第一次是吓谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b212", "date": "2026-11-09", "slot": "13:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 37, "text": "体检中心比医院装修好\n\n查出问题还得回医院\n\n它到底查什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b213", "date": "2026-11-09", "slot": "13:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 32, "text": "孩子作业要家长批，家长群要家长回\n\n老师的活谁干？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b214", "date": "2026-11-09", "slot": "13:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 35, "text": "家长群里，老师发通知，家长排队「收到」\n\n收到之后谁看？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b215", "date": "2026-11-09", "slot": "13:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "chars": 30, "text": "双减之后，作业变成了「实践活动」\n\n家长更忙了\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b216", "date": "2026-11-09", "slot": "13:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 30, "text": "学区房一平贵两万，就为个名额\n\n名额是谁划的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b217", "date": "2026-11-09", "slot": "13:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 30, "text": "补习班关了，一对一贵了三倍\n\n减负减到谁头上？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b218", "date": "2026-11-09", "slot": "13:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 32, "text": "买学区房的家长，赌的是政策不变\n\n政策敢承诺几年？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b219", "date": "2026-11-09", "slot": "13:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 27, "text": "考公报名两百万人，招两万\n\n剩下的去哪？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b220", "date": "2026-11-09", "slot": "13:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 32, "text": "考研三年，出来还是投简历\n\n这三年算投资还是算躲？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b221", "date": "2026-11-09", "slot": "13:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 38, "text": "培训机构说「上岸率 80%」\n\n统计的是报了班的还是没退费的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b222", "date": "2026-11-09", "slot": "13:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 37, "text": "面试问「你能接受加班吗」\n\n答能，入职后天天加\n\n这算骗吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b223", "date": "2026-11-09", "slot": "13:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 26, "text": "试用期六个月，工资打八折\n\n这合法吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b224", "date": "2026-11-09", "slot": "13:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "chars": 26, "text": "HR 说我们弹性很大\n\n弹的是下班时间\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b225", "date": "2026-11-09", "slot": "08:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 35, "text": "年终奖发了个「感谢信」\n\n信里说共渡难关\n\n难关是谁的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b226", "date": "2026-11-09", "slot": "08:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 29, "text": "工资十年涨了两千，房价涨了两万\n\n谁跑赢了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b227", "date": "2026-11-09", "slot": "08:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 38, "text": "同事离职前问：涨薪什么时候\n\n领导说「看年底」\n\n年底到了吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b228", "date": "2026-11-09", "slot": "08:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 45, "text": "相亲第一句问房子，第二句问车\n\n第三句问父母退休金\n\n这是找对象还是查资产？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b229", "date": "2026-11-09", "slot": "08:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 28, "text": "彩礼从八万涨到十八万\n\n涨价的依据是什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b230", "date": "2026-11-09", "slot": "08:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 31, "text": "介绍人说对方条件好\n\n条件好的人为什么还要相亲？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b231", "date": "2026-11-09", "slot": "08:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 39, "text": "过年被问工资、对象、买房\n\n回答完还得被比较\n\n这饭非吃不可吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b232", "date": "2026-11-09", "slot": "08:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 29, "text": "亲戚说「为你好」\n\n为我好能不能先借我点钱？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b233", "date": "2026-11-09", "slot": "08:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 26, "text": "一年见一次，问的都是隐私\n\n这叫关心？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b234", "date": "2026-11-09", "slot": "08:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 33, "text": "同学群三年没说话，一说话就是卖货\n\n这感情值多少钱？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b235", "date": "2026-11-09", "slot": "08:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 32, "text": "群发的祝福，连名字都不改\n\n我要的是祝福还是群发？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b236", "date": "2026-11-09", "slot": "08:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 26, "text": "同学会，混得好的坐主桌\n\n谁定的座次？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b237", "date": "2026-11-09", "slot": "08:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 33, "text": "直播间喊「家人们」，一晚上卖一个亿\n\n家人有这么贵？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b238", "date": "2026-11-09", "slot": "08:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 40, "text": "砍一刀，差 0.01 元\n\n这 0.01 元砍了三天\n\n谁设计的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b239", "date": "2026-11-09", "slot": "08:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 34, "text": "主播说全网最低价\n\n比完价发现贵二十\n\n最低是跟谁比？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b240", "date": "2026-11-09", "slot": "08:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 35, "text": "打车显示 28，下车收 41\n\n多出来的是堵车还是算法？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b241", "date": "2026-11-09", "slot": "07:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 29, "text": "高峰期加价一倍，司机说没多拿\n\n那加给谁了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b242", "date": "2026-11-09", "slot": "07:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 32, "text": "网约车说「为您匹配最近车辆」\n\n三公里外也叫最近？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b243", "date": "2026-11-09", "slot": "07:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 24, "text": "地铁安检，水要喝一口\n\n喝给谁看？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b244", "date": "2026-11-09", "slot": "07:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 33, "text": "早高峰限流，排队二十分钟\n\n这城市到底装得下多少人？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b245", "date": "2026-11-09", "slot": "07:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 28, "text": "通勤两小时，上班八小时\n\n一天有几个自己？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b246", "date": "2026-11-09", "slot": "07:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 42, "text": "电梯里一周换三次广告\n\n住了三年只记住「整容分期」\n\n这投放算成功吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b247", "date": "2026-11-09", "slot": "07:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 28, "text": "物业费涨了，电梯广告收入呢？\n\n公示过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b248", "date": "2026-11-09", "slot": "07:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 29, "text": "电梯广告说「0 利息」\n\n0 利息靠什么赚？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b249", "date": "2026-11-09", "slot": "07:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 27, "text": "停车十分钟，罚单两百\n\n这十分钟值两百？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b250", "date": "2026-11-09", "slot": "07:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 32, "text": "车位卖三十万，租一个月八百\n\n哪个更划算，算过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b251", "date": "2026-11-09", "slot": "07:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 31, "text": "路边停车位画了又擦，擦了又画\n\n画的依据是什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b252", "date": "2026-11-09", "slot": "07:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 28, "text": "遛狗不牵绳，说「它不咬人」\n\n咬了算谁的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b253", "date": "2026-11-09", "slot": "07:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 28, "text": "小区禁养大型犬，公告贴了三年\n\n谁在执行？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b254", "date": "2026-11-09", "slot": "07:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 38, "text": "宠物医院比人医院贵\n\n狗看病五百，人看病五十\n\n这定价谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b255", "date": "2026-11-09", "slot": "07:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 30, "text": "景区门票一百二，进去全是商店\n\n看景还是看店？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b256", "date": "2026-11-09", "slot": "07:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 34, "text": "古镇修得一模一样\n\n换个城市还是那条街\n\n这算旅游吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b257", "date": "2026-11-09", "slot": "06:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 32, "text": "门票预约、观光车、索道另收费\n\n一张票到底包什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b258", "date": "2026-11-09", "slot": "06:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 39, "text": "中介说「这价已经到底了」\n\n到底之后又降了十万\n\n到底是谁的底？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b259", "date": "2026-11-09", "slot": "06:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 33, "text": "二手房挂半年没人问，中介让降二十万\n\n降的钱是谁的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b260", "date": "2026-11-09", "slot": "06:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 31, "text": "看房时说的学区、地铁、规划\n\n哪一条能写进合同？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b261", "date": "2026-11-09", "slot": "06:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 40, "text": "加班到十点，打车费不报\n\n说「年轻人别计较」\n\n那计较的人去哪了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b262", "date": "2026-11-09", "slot": "06:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 32, "text": "领导说今天不加班\n\n六点开会到八点\n\n这叫不加班？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b263", "date": "2026-11-09", "slot": "06:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 31, "text": "周末团建算不算上班？\n\n不去扣绩效\n\n这算自愿？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b264", "date": "2026-11-09", "slot": "06:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 33, "text": "「公司上市就财务自由」\n\n上市三年了\n\n自由的是谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b265", "date": "2026-11-09", "slot": "06:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 25, "text": "老板说共渡难关\n\n难关过了，奖金呢？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b266", "date": "2026-11-09", "slot": "06:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 38, "text": "谈情怀的时候不谈钱\n\n谈钱的时候说情怀\n\n这套组合拳谁发明的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b267", "date": "2026-11-09", "slot": "06:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "chars": 31, "text": "中介费一个月房租\n\n带看两套\n\n这钱赚得比我容易\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b268", "date": "2026-11-09", "slot": "06:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 41, "text": "合同写「家电齐全」\n\n冰箱不制冷，洗衣机漏水\n\n齐全的标准是能通电？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b269", "date": "2026-11-09", "slot": "06:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 35, "text": "合租房，隔断墙薄得像纸\n\n隔壁打呼我听得见\n\n这合法吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b270", "date": "2026-11-09", "slot": "06:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 34, "text": "房东说「我这房子不愁租」\n\n空了两个月\n\n不愁的是嘴？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b271", "date": "2026-11-09", "slot": "06:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 34, "text": "涨租通知发在群里，@所有人\n\n不同意就搬\n\n这算协商？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b272", "date": "2026-11-09", "slot": "06:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 35, "text": "中介说房价到底了\n\n第二天同户型降五万\n\n到底是谁的底？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b273", "date": "2026-11-09", "slot": "23:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 33, "text": "物业费按建筑面积收\n\n公摊也算钱\n\n服务按公摊给吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b274", "date": "2026-11-09", "slot": "23:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 30, "text": "电梯坏了，说要动用维修基金\n\n基金账本见过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b275", "date": "2026-11-09", "slot": "23:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 24, "text": "小区停车费涨了\n\n业主大会开过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b276", "date": "2026-11-09", "slot": "23:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 30, "text": "配送费涨价，说给骑手\n\n骑手说没收到\n\n钱呢？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b277", "date": "2026-11-09", "slot": "23:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 33, "text": "点餐必须选「准时宝」\n\n迟到赔三块\n\n这保险谁在赚？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b278", "date": "2026-11-09", "slot": "23:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 36, "text": "商家说平台抽成 22%\n\n平台说给流量\n\n流量值 22%？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b279", "date": "2026-11-09", "slot": "23:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 27, "text": "快递不送上门，投诉就拉黑\n\n谁给的权力？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b280", "date": "2026-11-09", "slot": "23:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 32, "text": "驿站代收，丢件谁赔？\n\n说查监控\n\n监控坏了一年了\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b281", "date": "2026-11-09", "slot": "23:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 23, "text": "生鲜放驿站一下午\n\n坏了算谁的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b282", "date": "2026-11-09", "slot": "23:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 29, "text": "预售比现货贵\n\n退定金要等七天\n\n这算优惠？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b283", "date": "2026-11-09", "slot": "23:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "chars": 28, "text": "满减凑单，凑完发现单价更高\n\n算法比我会算\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b284", "date": "2026-11-09", "slot": "23:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "chars": 30, "text": "保价 15 天\n\n第 16 天降价\n\n卡得真准\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b285", "date": "2026-11-09", "slot": "23:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "chars": 37, "text": "客服说分期「免息」\n\n免的是利息，收的是手续费\n\n换汤不换药\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b286", "date": "2026-11-09", "slot": "23:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 34, "text": "最低还款，利息按全额\n\n银行不会主动说\n\n合同哪一页？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b287", "date": "2026-11-09", "slot": "23:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "chars": 26, "text": "办卡送行李箱\n\n年费三百\n\n箱子值三十\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b288", "date": "2026-11-09", "slot": "23:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "chars": 30, "text": "年卡到期前一个月，销售开始热情\n\n热情的是续费\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b289", "date": "2026-11-09", "slot": "05:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 33, "text": "私教说「你这种体态再不练就废了」\n\n废了还能上班吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b290", "date": "2026-11-09", "slot": "05:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 29, "text": "健身房跑路，会员群变维权群\n\n预付费谁监管？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b291", "date": "2026-11-09", "slot": "05:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 35, "text": "剪发 38，总监 128\n\n剪出来一模一样\n\n差在头衔？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b292", "date": "2026-11-09", "slot": "05:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 33, "text": "办卡时说随时退\n\n退时说活动价不退\n\n活动是谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b293", "date": "2026-11-09", "slot": "05:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 35, "text": "教练让买 30 节课\n\n说能瘦 20 斤\n\n合同敢写吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b294", "date": "2026-11-09", "slot": "05:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 34, "text": "体测仪打印一张纸\n\n说体脂 28%\n\n这机器校准过吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b295", "date": "2026-11-09", "slot": "05:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 24, "text": "挂号黄牛说「内部号」\n\n内部是谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b296", "date": "2026-11-09", "slot": "05:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 30, "text": "演唱会门票秒没\n\n黄牛手里一堆\n\n票从哪来的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b297", "date": "2026-11-09", "slot": "05:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 38, "text": "专家号 300，黄牛 800\n\n多出来的 500 买的是什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b298", "date": "2026-11-09", "slot": "05:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 28, "text": "体检套餐越贵，项目越多\n\n医生看得过来吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b299", "date": "2026-11-09", "slot": "05:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 35, "text": "体检报告建议复查\n\n复查花钱，结果没事\n\n第一次是误诊？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b300", "date": "2026-11-09", "slot": "05:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 28, "text": "公司体检，报告先给 HR？\n\n隐私谁保护？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b301", "date": "2026-11-09", "slot": "05:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 30, "text": "老师发通知，家长排队「收到」\n\n收到有什么用？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b302", "date": "2026-11-09", "slot": "05:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "chars": 23, "text": "家长群变成夸夸群\n\n谁先夸谁尴尬\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b303", "date": "2026-11-09", "slot": "05:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 21, "text": "作业让家长批\n\n老师改什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b304", "date": "2026-11-09", "slot": "05:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 21, "text": "学区房降价了\n\n学区还在吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b305", "date": "2026-11-09", "slot": "04:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 27, "text": "补习班转地下，一对一更贵\n\n减负减给谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b306", "date": "2026-11-09", "slot": "04:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 27, "text": "名校分校开到家门口\n\n师资是本部来的吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b307", "date": "2026-11-09", "slot": "04:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 27, "text": "考公三不限岗位，两千人抢一个\n\n图什么？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b308", "date": "2026-11-09", "slot": "04:00", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 31, "text": "上岸第一年，工资四千\n\n说稳定\n\n稳定能买房吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b309", "date": "2026-11-09", "slot": "04:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 27, "text": "考研二战三战\n\n家里出钱\n\n这算啃老吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b310", "date": "2026-11-09", "slot": "04:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 26, "text": "面试问婚育计划\n\n这是招人还是查户口？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b311", "date": "2026-11-09", "slot": "04:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 27, "text": "试用期不交社保\n\n说转正补\n\n补得了吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b312", "date": "2026-11-09", "slot": "04:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "chars": 27, "text": "简历写「抗压能力强」\n\n入职发现是加班多\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b313", "date": "2026-11-09", "slot": "04:30", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 34, "text": "工资条上基本工资两千\n\n剩下全是绩效\n\n请假扣哪部分？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b314", "date": "2026-11-09", "slot": "04:30", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "chars": 31, "text": "年终奖发购物卡\n\n说等同现金\n\n卡只能在一家店花\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b315", "date": "2026-11-09", "slot": "04:30", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 27, "text": "涨薪 5%，房租涨 10%\n\n这叫涨薪？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b316", "date": "2026-11-09", "slot": "04:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "chars": 33, "text": "相亲对象问「你有房吗」\n\n我说有贷款\n\n对方说那不算\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b317", "date": "2026-11-09", "slot": "04:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 32, "text": "介绍人把 35 岁说成 30 岁\n\n见面怎么解释？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b318", "date": "2026-11-09", "slot": "04:45", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 27, "text": "彩礼谈崩，感情也崩\n\n这婚是结给谁看的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b319", "date": "2026-11-09", "slot": "04:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "chars": 29, "text": "亲戚借钱，说「一家人」\n\n还钱时变「最近紧」\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b320", "date": "2026-11-09", "slot": "04:45", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 28, "text": "过年红包，给多给少都有人说\n\n标准谁定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b321", "date": "2026-11-09", "slot": "03:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "chars": 24, "text": "同学群发链接砍价\n\n砍完就没人说话\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b322", "date": "2026-11-09", "slot": "03:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 34, "text": "同学聚会 AA，组织者多收两百\n\n说场地费\n\n账单呢？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b323", "date": "2026-11-09", "slot": "03:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "陈述句", "chars": 23, "text": "主播说「最后三单」\n\n喊了一小时\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b324", "date": "2026-11-09", "slot": "03:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 30, "text": "直播间抽奖，中奖的是内部号？\n\n名单敢公示吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b325", "date": "2026-11-09", "slot": "03:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 31, "text": "带货翻车，主播说「我也是受害者」\n\n选品谁负责？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b326", "date": "2026-11-09", "slot": "03:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 24, "text": "打车绕路，投诉退三块\n\n时间谁赔？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b327", "date": "2026-11-09", "slot": "03:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 25, "text": "顺风车变拼车，绕一小时\n\n这叫顺路？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b328", "date": "2026-11-09", "slot": "03:15", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 32, "text": "地铁安检排长队\n\n包过机器，人不过\n\n这安检防谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b329", "date": "2026-11-09", "slot": "03:30", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 33, "text": "早高峰挤不上车\n\n站台说「请耐心等待」\n\n等到几点？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b330", "date": "2026-11-09", "slot": "03:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 32, "text": "电梯广告收入归业主\n\n物业说「用于维护」\n\n账呢？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b331", "date": "2026-11-09", "slot": "03:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 29, "text": "电梯里装人脸识别\n\n说为了安全\n\n数据存哪？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b332", "date": "2026-11-09", "slot": "03:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 42, "text": "商场停车 10 元一小时\n\n消费满 200 免 2 小时\n\n这算优惠？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b333", "date": "2026-11-09", "slot": "03:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 27, "text": "路边停车收费员手写发票\n\n这钱进财政吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b334", "date": "2026-11-09", "slot": "03:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 25, "text": "狗证办了，遛狗还是不牵绳\n\n罚过谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b335", "date": "2026-11-09", "slot": "03:45", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 31, "text": "宠物殡葬一次两千\n\n比人还贵\n\n这市场谁定的价？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b336", "date": "2026-11-09", "slot": "03:45", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "陈述句", "chars": 25, "text": "景区门票降了，观光车涨了\n\n总价没变\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b337", "date": "2026-11-09", "slot": "02:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 27, "text": "古镇免费，停车 50\n\n羊毛出在谁身上？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b338", "date": "2026-11-09", "slot": "02:00", "origin": "池", "tag": "金融", "type": "日常观察", "mode": "问句", "chars": 29, "text": "网红打卡点排队两小时\n\n拍照五分钟\n\n值吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b339", "date": "2026-11-09", "slot": "02:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 28, "text": "中介带看十套，一套没成\n\n要收「带看费」？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b340", "date": "2026-11-09", "slot": "02:00", "origin": "池", "tag": "居住", "type": "日常观察", "mode": "问句", "chars": 28, "text": "中介说「业主急售」\n\n急的是业主还是中介？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b341", "date": "2026-11-09", "slot": "02:15", "origin": "池", "tag": "人情", "type": "日常观察", "mode": "问句", "chars": 30, "text": "份子钱从 200 涨到 800\n\n工资涨了吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b342", "date": "2026-11-09", "slot": "02:15", "origin": "池", "tag": "人情", "type": "日常观察", "mode": "问句", "chars": 32, "text": "同事结婚随 500\n\n我结婚他没来\n\n这账怎么算？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b343", "date": "2026-11-09", "slot": "02:15", "origin": "池", "tag": "教育", "type": "日常观察", "mode": "问句", "chars": 25, "text": "宿舍装空调要学生摊钱\n\n学费里没有？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b344", "date": "2026-11-09", "slot": "02:15", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 29, "text": "实习没工资，说「学经验」\n\n经验能交房租吗？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b345", "date": "2026-11-09", "slot": "02:30", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "陈述句", "chars": 36, "text": "副业课 999\n\n教你怎么月入过万\n\n他自己靠卖课月入过万\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b346", "date": "2026-11-09", "slot": "02:30", "origin": "池", "tag": "就业", "type": "日常观察", "mode": "问句", "chars": 30, "text": "摆摊被劝离，说影响市容\n\n那夜市怎么又让摆了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b347", "date": "2026-11-09", "slot": "02:30", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "陈述句", "chars": 29, "text": "短视频说「三招教你财富自由」\n\n第三招是卖课\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b348", "date": "2026-11-09", "slot": "02:30", "origin": "池", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 36, "text": "社区食堂 15 块两荤一素\n\n开业三个月关了\n\n补贴停了？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b349", "date": "2026-11-09", "slot": "02:45", "origin": "池", "tag": "民生", "type": "日常观察", "mode": "陈述句", "chars": 27, "text": "老年大学报名秒满\n\n年轻人抢课抢不过老人\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b350", "date": "2026-11-09", "slot": "02:45", "origin": "池", "tag": "通信", "type": "日常观察", "mode": "问句", "chars": 27, "text": "广场舞音响开到最大\n\n投诉没用\n\n谁管？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b351", "date": "2026-11-09", "slot": "02:45", "origin": "池", "tag": "人情", "type": "日常观察", "mode": "问句", "chars": 36, "text": "楼上装修，早七点电钻\n\n物业说「上班时间」\n\n哪条规定的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b352", "date": "2026-11-09", "slot": "02:45", "origin": "池", "tag": "人情", "type": "日常观察", "mode": "问句", "chars": 30, "text": "加油站推销燃油宝\n\n说积碳严重\n\n不买会怎样？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b353", "date": "2026-11-09", "slot": "01:00", "origin": "池", "tag": "教育", "type": "日常观察", "mode": "问句", "chars": 36, "text": "年检找黄牛 300 包过\n\n自己排队两小时不过\n\n差在哪？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b354", "date": "2026-11-09", "slot": "01:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 33, "text": "保险推销说「有病赔钱」\n\n条款里免赔十条\n\n谁看过？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b355", "date": "2026-11-09", "slot": "01:00", "origin": "池", "tag": "职场", "type": "日常观察", "mode": "问句", "chars": 35, "text": "理财经理推荐「稳健型」\n\n亏了 20%\n\n稳健谁定义的？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b356", "date": "2026-11-09", "slot": "01:00", "origin": "池", "tag": "就业", "type": "日常观察", "mode": "陈述句", "chars": 29, "text": "基金经理亏 30%，管理费照收\n\n这钱赚得稳\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b357", "date": "2026-11-09", "slot": "01:15", "origin": "池", "tag": "消费", "type": "日常观察", "mode": "问句", "chars": 29, "text": "股市跌了，专家说「长期看好」\n\n长期是多长？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b358", "date": "2026-11-09", "slot": "01:15", "origin": "池", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 32, "text": "彩票中奖 500 万\n\n领奖戴头套\n\n怕谁认出来？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b359", "date": "2026-11-09", "slot": "01:15", "origin": "池", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 28, "text": "医保报销，先自费后报\n\n垫不起的人怎么办？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b360", "date": "2026-11-09", "slot": "01:15", "origin": "池", "tag": "通信", "type": "日常观察", "mode": "问句", "chars": 31, "text": "药店推荐最贵的\n\n说「这个效果好」\n\n提成多少？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b361", "date": "2026-11-09", "slot": "01:30", "origin": "池", "tag": "人情", "type": "日常观察", "mode": "问句", "chars": 28, "text": "补牙 300，种牙 8000\n\n差价在哪？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b362", "date": "2026-11-09", "slot": "01:30", "origin": "池", "tag": "人情", "type": "日常观察", "mode": "问句", "chars": 29, "text": "眼镜店验光免费\n\n镜片 800\n\n成本多少？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "b363", "date": "2026-11-09", "slot": "01:30", "origin": "池", "tag": "教育", "type": "日常观察", "mode": "问句", "chars": 31, "text": "高铁盒饭 45\n\n成本 15\n\n剩 30 给谁？\n\n@grok", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": 067", "date": "2026-11-10", "slot": "11:30", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 23, "text": "社区团购 9 块 9 十斤土豆\n农民拿到几块？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p068", "date": "2026-11-10", "slot": "11:45", "origin": "选定", "tag": "社会", "type": "日常观察", "mode": "问句", "chars": 21, "text": "演唱会散场三万人，地铁加开两班\n这算预案？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p069", "date": "2026-11-10", "slot": "12:00", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 35, "text": "预制菜进食堂，标了吗\n家长问一句，学校说合规\n合规是底线\n不是卖点吧？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p070", "date": "2026-11-10", "slot": "12:15", "origin": "选定", "tag": "社会", "type": "日常观察", "mode": "问句", "chars": 26, "text": "景区插队的一家人，工作人员说管不了\n门票里含秩序吗？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p071", "date": "2026-11-10", "slot": "12:30", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 24, "text": "校服 380 一套，同款网售 80\n差价去哪了？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p072", "date": "2026-11-10", "slot": "12:45", "origin": "选定", "tag": "社会", "type": "日常观察", "mode": "问句", "chars": 22, "text": "地铁外放视频，劝阻的人被骂\n规矩是给谁定的？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p073", "date": "2026-11-10", "slot": "13:00", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 20, "text": "课后服务一学期 800\n老师加班费多少？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p074", "date": "2026-11-10", "slot": "13:15", "origin": "选定", "tag": "社会", "type": "日常观察", "mode": "问句", "chars": 20, "text": "遛狗不牵绳，物业说管不了\n咬了人算谁的？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p075", "date": "2026-11-10", "slot": "13:30", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 26, "text": "幼儿园托育 4000，老师工资 3500\n钱花哪了？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p076", "date": "2026-11-10", "slot": "13:45", "origin": "选定", "tag": "社会", "type": "日常观察", "mode": "问句", "chars": 26, "text": "邻居空调外机装我家窗下\n热风全往我这吹\n这算谁的墙？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p077", "date": "2026-11-10", "slot": "14:00", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 50, "text": "养老院 5000 一月，护工 1 对 8\n护工一个月到手多少\n这 5000 里\n有几成花在老人身上？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p078", "date": "2026-11-10", "slot": "14:15", "origin": "选定", "tag": "社会", "type": "日常观察", "mode": "问句", "chars": 23, "text": "医院排队三小时，看病三分钟\n这三分钟值多少钱？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p079", "date": "2026-11-10", "slot": "14:30", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 16, "text": "护工一天 300\n医院抽成多少？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p080", "date": "2026-11-10", "slot": "14:45", "origin": "选定", "tag": "社会", "type": "日常观察", "mode": "问句", "chars": 22, "text": "出租车拒载三公里内，说交班\n交班时间谁定的？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p081", "date": "2026-11-10", "slot": "15:00", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 41, "text": "医保报 70%，自费项目一长串\n进口药、耗材、检查\n哪些能报谁定的\n清单敢公开吗？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p082", "date": "2026-11-10", "slot": "15:15", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 22, "text": "养老金涨 3%，药价涨 30%\n这账谁算的？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p083", "date": "2026-11-10", "slot": "15:30", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 27, "text": "公积金按 5% 交，上限卡死\n高薪那部分不算，合理吗？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p084", "date": "2026-11-10", "slot": "15:45", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 25, "text": "落户要社保 7 年\n断一个月重算\n这一个月谁负责？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p085", "date": "2026-11-10", "slot": "16:00", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 51, "text": "学区房 800 万，划片一变 500 万\n跌掉的 300 万找谁要\n当初谁告诉你这是学区\n有人负责吗？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p086", "date": "2026-11-10", "slot": "16:15", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 26, "text": "小学 4 点放学，托管到 6 点收费\n家长几点下班？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p087", "date": "2026-11-10", "slot": "16:30", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 31, "text": "网贷日息万五\n广告只写万五\n折算成年化 18%\n这算不算误导？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p088", "date": "2026-11-10", "slot": "16:45", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 28, "text": "信用卡分期手续费 0.6%\n实际年化 13%\n谁在装傻？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p089", "date": "2026-11-10", "slot": "17:00", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 29, "text": "婚礼份子钱 800 起，一桌 10 人\n办一场是赚还是亏？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p090", "date": "2026-11-10", "slot": "17:15", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 38, "text": "彩礼 18 万 8，嫁妆一床被子\n两家坐下来算这笔账\n算的是面子\n还是女儿？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p091", "date": "2026-11-10", "slot": "17:30", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 47, "text": "公园相亲角，条件写满一页纸\n本地户口、有房、无贷\n爱情排在第几行\n有人问过吗？@grok\n\n🤣", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p092", "date": "2026-11-10", "slot": "17:45", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 45, "text": "考研二战，一年学费加生活费 5 万\n考完还是投简历\n这 5 万买的是学历\n还是晚两年上班？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p093", "date": "2026-11-10", "slot": "18:00", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 28, "text": "灵活就业 2 亿人，社保自己交\n交满 15 年能领多少？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p094", "date": "2026-11-10", "slot": "18:15", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 26, "text": "外卖超时扣 3 块，骑手一单 4 块\n这规则谁定的？", "source_title": "", "source_url": "", "image": null, "image_credit": "", "image_origin": "", "preset": null}, {"id": "p095", "date": "2026-11-10", "slot": "18:30", "origin": "选定", "tag": "民生", "type": "日常观察", "mode": "问句", "chars": 40, "text": "网约车抽成 30%，司机说不知道\n平台说早就公开了\n公开在哪一页\n司机看得到吗？", "source_title": "
