<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对标账号 · 帖子评分</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar">
  <div class="row1">
    <span class="mark">X</span>
    <div class="titles">
      <h1>对标账号 · 评分</h1>
      <div class="meta" id="meta-line">载入中…</div>
    </div>
    <nav class="navlinks">
      <a href="index.html">稿池</a>
      <a class="on" href="target.html">对标评分</a>
    </nav>
    <div class="right">
      <span class="chip wait" id="sync-chip"><i></i><span id="sync-text">同步中</span></span>
      <span class="kbd">0–10 分 · 起草时优先参考高分帖</span>
    </div>
  </div>
</header>

<div class="shell">
  <section class="kpis">
    <div class="kpi"><div class="k-label">总数</div><div class="k-num" id="c-total">0</div><div class="k-sub" id="s-total">—</div><div class="bar"><i id="b-total"></i></div></div>
    <div class="kpi"><div class="k-label">已评</div><div class="k-num ok" id="c-scored">0</div><div class="k-sub" id="s-scored">—</div><div class="bar"><i class="ok" id="b-scored"></i></div></div>
    <div class="kpi"><div class="k-label">未评</div><div class="k-num" id="c-unscored">0</div><div class="k-sub" id="s-unscored">—</div><div class="bar"><i id="b-unscored"></i></div></div>
    <div class="kpi"><div class="k-label">均分</div><div class="k-num" id="c-avg">—</div><div class="k-sub" id="s-avg">—</div><div class="bar"><i id="b-avg"></i></div></div>
    <div class="kpi"><div class="k-label">7 分以上</div><div class="k-num dup" id="c-high">0</div><div class="k-sub" id="s-high">—</div><div class="bar"><i class="dup" id="b-high"></i></div></div>
  </section>
  <details class="stats" id="stats" open>
    <summary><span>统计</span><span class="sum-meta" id="sum-meta"></span></summary>
  <section class="charts" style="grid-template-columns:1.55fr 1fr">
    <div class="chartcard"><div class="ch-head"><h3>评分分布</h3><span class="hint" id="h-score"></span></div><div class="ch-body" id="ch-score"></div></div>
    <div class="chartcard"><div class="ch-head"><h3>评分进度</h3><span class="hint" id="h-progress"></span></div><div class="ch-body" id="ch-progress"></div></div>
  </section>
  </details>
</div>

<div class="toolbar-wrap">
  <div class="toolbar">
    <input type="search" id="q" placeholder="搜正文">
    <div class="selbar"><select id="f-score">
      <option value="">全部分数</option>
      <option value="un">未评分</option>
      <option value="high">9–10</option>
      <option value="mid">7–8</option>
      <option value="low">5–6</option>
      <option value="bad">0–4</option>
    </select>
    <select id="f-date"><option value="">全部日期</option></select>
    <select id="f-sort">
      <option value="time">按时间</option>
      <option value="score">按分数</option>
      <option value="views">按展示</option>
    </select>
    </div>
    <div class="actbar"><button id="autofill">按展示补分</button>
    <button id="save" class="primary">保存到仓库</button>
    <button id="export">导出评分</button>
    <button id="import">导入评分</button>
    <button id="reset">重置</button></div>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</div>
<main id="list"></main>
<div id="toast"></div>
<script>
const POSTS = __DATA__;
const KEY = 'zs-target-ratings';
let booting = true;
let queued = null;
const st = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } })();
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { toast('本地存储写入失败', true); }
  scheduleSync();
};

// 部署包里注入的仓库评分；localStorage 已有记录优先。
(() => {
  const seed = window.__ZS_SEED__ || {};
  let changed = false;
  Object.entries(seed).forEach(([id, v]) => {
    if (typeof v !== 'number' || st[id] != null) return;
    st[id] = v;
    changed = true;
  });
  if (changed) save();
})();

/* ---------- 与线上同步（/api/state） ---------- */
const SYNC = '/api/state';
function scheduleSync() {
  if (booting) return;
  clearTimeout(queued);
  queued = setTimeout(pushState, 800);
}

async function pushState() {
  try {
    const r = await fetch(SYNC, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ratings: st }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setSync('ok', '已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }));
    updateCounters();
  } catch (e) {
    setSync('err', '同步失败');
    toast('同步失败：评分只存在本机', true);
  }
}

async function pullState() {
  setSync('wait', '同步中');
  try {
    const r = await fetch(SYNC, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    const remote = (d && d.ratings) || {};
    const localOnly = Object.keys(st).some(id => !(id in remote));
    Object.entries(remote).forEach(([id, v]) => { if (typeof v === 'number') st[id] = v; });
    try { localStorage.setItem(KEY, JSON.stringify(st)); }
    catch (e) { toast('本地存储写入失败', true); }
    setSync('ok', '已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }));
    if (localOnly) { booting = false; scheduleSync(); }
  } catch (e) {
    setSync('err', '离线');
  }
}

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
let toastTimer = null;
const toast = (msg, err) => {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 1600);
};

const scoreOf = id => (typeof st[id] === 'number' ? st[id] : null);

function stats() {
  const scored = POSTS.filter(p => scoreOf(p.id) !== null);
  const sum = scored.reduce((s, p) => s + scoreOf(p.id), 0);
  return { n: scored.length, avg: scored.length ? (sum / scored.length).toFixed(1) : '—' };
}

const fmt = n => Number(n).toLocaleString('en-US');
let syncedAt = '';
const setSync = (state, text) => {
  const chip = $('#sync-chip');
  if (!chip) return;
  chip.className = 'chip ' + state;
  $('#sync-text').textContent = text;
  if (state === 'ok') syncedAt = text;
};

function updateCounters() {
  const { n, avg } = stats();
  const total = POSTS.length || 1;
  const high = POSTS.filter(p => scoreOf(p.id) >= 7).length;
  const pct = x => Math.round(x / total * 100);
  $('#c-total').textContent = fmt(POSTS.length);
  $('#c-scored').textContent = fmt(n);
  $('#c-unscored').textContent = fmt(POSTS.length - n);
  $('#c-avg').textContent = avg;
  $('#c-high').textContent = fmt(high);
  $('#s-total').textContent = `${new Set(POSTS.map(p => p.date)).size} 天`;
  $('#s-scored').textContent = `占 ${pct(n)}%`;
  $('#s-unscored').textContent = (POSTS.length - n) ? '还没打分' : '全部评完';
  $('#s-avg').textContent = '0–10 分制';
  $('#s-high').textContent = n ? `占已评 ${Math.round(high / n * 100)}%` : '—';
  $('#b-total').style.width = '100%';
  $('#b-scored').style.width = pct(n) + '%';
  $('#b-unscored').style.width = pct(POSTS.length - n) + '%';
  $('#b-avg').style.width = Math.round((Number(avg) || 0) * 10) + '%';
  $('#b-high').style.width = pct(high) + '%';
  $('#meta-line').textContent = `${fmt(POSTS.length)} 条对标帖 · 已评 ${fmt(n)} 条 · 均分 ${avg}`;
  const sum = $('#sum-meta');
  if (sum) sum.textContent = `均分 ${avg} · 已评 ${n}/${POSTS.length}`;
}

/* ---------- 图表 ---------- */
const SVG_NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => {
  const n = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v));
  return n;
};
const svgTitle = text => {
  const t = document.createElementNS(SVG_NS, 'title');
  t.textContent = text;
  return t;
};

function vbarChart(host, data, opts = {}) {
  const W = 520, H = 150, padL = 26, padR = 10, padT = 12, padB = 22;
  const total = data.reduce((a, d) => a + d.value, 0);
  const peak = Math.max(1, ...data.map(d => d.value));
  const mag = Math.pow(10, Math.floor(Math.log10(peak)));
  const raw = peak / mag;
  const ladder = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  const max = (ladder.find(v => v >= raw) || 10) * mag;
  const iw = W - padL - padR, ih = H - padT - padB;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, 'aria-label': opts.label || '图表' });
  [0, 0.5, 1].forEach(f => {
    const y = padT + ih - f * ih;
    svg.append(svgEl('line', { x1: padL, x2: W - padR, y1: y, y2: y, stroke: f ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.12)' }));
    const t = svgEl('text', { x: padL - 6, y: y + 3, 'text-anchor': 'end', 'font-size': 8.5, fill: '#6f6f6f' });
    t.textContent = Math.round(max * f);
    svg.append(t);
  });
  const n = data.length;
  const gap = n > 10 ? 4 : 10;
  const bw = Math.max(3, (iw - gap * (n - 1)) / n);
  const step = n > 1 ? (iw - bw) / (n - 1) : 0;
  data.forEach((d, i) => {
    const bh = d.value ? Math.max(Math.round((d.value / max) * ih), 2) : 0;
    const x = padL + i * step;
    const rect = svgEl('rect', {
      x, y: padT + ih - bh, width: bw, height: bh,
      rx: Math.min(3, bw / 2), fill: d.color || opts.color || '#3b82f6',
    });
    rect.append(svgTitle(`${d.label} 分：${fmt(d.value)} 条`));
    svg.append(rect);
    if (opts.showValues && d.value) {
      const v = svgEl('text', { x: x + bw / 2, y: padT + ih - bh - 4, 'text-anchor': 'middle', 'font-size': 8.5, fill: '#8a8a8a' });
      v.textContent = d.value;
      svg.append(v);
    }
    const t = svgEl('text', { x: x + bw / 2, y: H - 7, 'text-anchor': 'middle', 'font-size': 8.5, fill: '#6f6f6f' });
    t.textContent = d.label;
    svg.append(t);
  });
  host.replaceChildren(svg);
}

function donutChart(host, data, total, centerLabel) {
  const S = 132, r = 52, w = 13, c = 2 * Math.PI * r;
  const svg = svgEl('svg', { viewBox: `0 0 ${S} ${S}`, 'aria-label': '评分进度' });
  svg.append(svgEl('circle', { cx: S / 2, cy: S / 2, r, fill: 'none', stroke: 'rgba(255,255,255,.07)', 'stroke-width': w }));
  let off = 0;
  data.forEach(d => {
    if (!d.value) return;
    const len = (d.value / total) * c;
    const seg = svgEl('circle', {
      cx: S / 2, cy: S / 2, r, fill: 'none', stroke: d.color, 'stroke-width': w,
      'stroke-dasharray': `${Math.max(len - 2.5, 0.6)} ${c}`,
      'stroke-dashoffset': -off,
      transform: `rotate(-90 ${S / 2} ${S / 2})`,
      'stroke-linecap': 'round',
    });
    seg.append(svgTitle(`${d.label}：${fmt(d.value)}`));
    off += len;
    svg.append(seg);
  });
  const pct = Math.round((data[0].value / total) * 100);
  const big = svgEl('text', { x: S / 2, y: S / 2 - 1, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'donut-center' });
  big.textContent = pct + '%';
  const unit = svgEl('text', { x: S / 2, y: S / 2 + 16, 'text-anchor': 'middle', class: 'donut-sub' });
  unit.textContent = centerLabel || '已评';
  svg.append(big, unit);

  const legend = el('div', 'legend');
  data.forEach(d => {
    const row = el('div', 'row');
    const dot = el('i');
    dot.style.background = d.color;
    row.append(dot, document.createTextNode(d.label), el('b', null, fmt(d.value)),
      el('span', 'pct', Math.round(d.value / total * 100) + '%'));
    legend.append(row);
  });
  const wrap = el('div', 'donut-wrap');
  wrap.append(svg, legend);
  host.replaceChildren(wrap);
}

function renderCharts() {
  const buckets = Array.from({ length: 11 }, (_, i) => ({ label: String(i), value: 0 }));
  POSTS.forEach(p => { const s = scoreOf(p.id); if (s !== null) buckets[s].value += 1; });
  const colorFor = i => i <= 2 ? '#f87171' : i <= 4 ? '#fb923c' : i <= 6 ? '#eab308' : i <= 8 ? '#3b82f6' : '#34d399';
  buckets.forEach((b, i) => { b.color = colorFor(i); });
  const { n } = stats();
  if (!n) {
    $('#ch-score').replaceChildren(el('div', 'empty', '还没有评分：点下面的 0–10 给对标帖打分'));
    $('#h-score').textContent = '';
  } else {
    vbarChart($('#ch-score'), buckets, { showValues: true, label: '评分分布' });
    $('#h-score').textContent = `${fmt(n)} 条已评 · 均分 ${stats().avg}`;
  }
  donutChart($('#ch-progress'), [
    { label: '已评', value: n, color: '#34d399' },
    { label: '未评', value: POSTS.length - n, color: '#4d4d4d' },
  ], POSTS.length || 1, '已评');
  $('#h-progress').textContent = `${fmt(POSTS.length - n)} 条未评`;
}

/* ---------- 卡片 ---------- */
function buildCard(p) {
  const card = el('div', 'card');
  card.dataset.id = p.id;
  const head = el('div', 'head');
  head.append(el('span', 'badge', p.date), el('span', 'badge', p.chars + ' 字'));
  if (p.media) head.append(el('span', 'badge t', '带图'));
  const scoreTag = el('span', 'state');
  head.append(scoreTag);

  const body = el('div', 'body');
  const textcol = el('div', 'textcol');
  textcol.append(el('div', 'text', p.text));
  body.append(textcol);

  const meta = el('div', 'meta');
  meta.append(el('span', null, `展示 ${p.views ?? '—'}`), el('span', null, `赞 ${p.likes ?? '—'}`),
    el('span', null, `回复 ${p.replies ?? '—'}`));
  const link = el('a', null, '原帖');
  link.href = p.url; link.target = '_blank'; link.rel = 'noopener'; link.style.color = 'var(--acc)';
  meta.append(link);

  const actions = el('div', 'actions');
  const rate = el('div', 'rate');
  const buttons = [];
  for (let i = 0; i <= 10; i++) {
    const b = el('button', null, String(i));
    b.addEventListener('click', () => { st[p.id] = i; save(); refresh(); applyFilter(); toast(`已评 ${i} 分`); });
    buttons.push(b); rate.append(b);
  }
  const clear = el('button', null, '清除');
  clear.addEventListener('click', () => { delete st[p.id]; save(); refresh(); applyFilter(); toast('已清除评分'); });
  actions.append(rate, clear);

  const foot = el('div', 'cardfoot');
  foot.append(meta, actions);
  card.append(head, body, foot);

  function refresh() {
    const s = scoreOf(p.id);
    buttons.forEach((b, i) => b.classList.toggle('on', s === i));
    scoreTag.className = 'state' + (s === null ? '' : (s >= 8 ? ' used' : (s <= 4 ? ' rejected' : ' edited')));
    scoreTag.textContent = s === null ? '未评分' : s + ' 分';
    updateCounters(); renderCharts();
  }
  card.refresh = refresh;
  refresh();
  return card;
}

function applyFilter() {
  const q = $('#q').value.trim().toLowerCase();
  const fs = $('#f-score').value, date = $('#f-date').value;
  let shown = 0;
  document.querySelectorAll('.card').forEach(card => {
    const p = card._p;
    const s = scoreOf(p.id);
    let ok = true;
    if (q && !p.text.toLowerCase().includes(q)) ok = false;
    if (ok && date && p.date !== date) ok = false;
    if (ok && fs) {
      if (fs === 'un') ok = s === null;
      else if (fs === 'high') ok = s !== null && s >= 9;
      else if (fs === 'mid') ok = s !== null && s >= 7 && s <= 8;
      else if (fs === 'low') ok = s !== null && s >= 5 && s <= 6;
      else if (fs === 'bad') ok = s !== null && s <= 4;
    }
    card.hidden = !ok;
    if (ok) shown++;
  });
  $('#c-total').textContent = POSTS.length;
  $('#c-scored').textContent = stats().n;
  $('#c-avg').textContent = stats().avg;
}

/* ---------- 启动 ---------- */
if (matchMedia('(max-width:760px)').matches) $('#stats').open = false;
const list = $('#list');
const frag = document.createDocumentFragment();
(async () => {
  await pullState();
  [...POSTS].forEach(p => {
    const c = buildCard(p);
    c._p = p;
    frag.append(c);
  });
  list.append(frag);
  applyFilter();
  booting = false;
})();

[...new Set(POSTS.map(p => p.date))].sort().forEach(d => { const o = el('option', null, d); o.value = d; $('#f-date').append(o); });

['q', 'f-score', 'f-date'].forEach(id => $('#' + id).addEventListener('input', applyFilter));
$('#f-sort').addEventListener('change', () => {
  const mode = $('#f-sort').value;
  const arr = [...POSTS].sort((a, b) => {
    if (mode === 'score') return (scoreOf(b.id) ?? -1) - (scoreOf(a.id) ?? -1);
    if (mode === 'views') return (b.views || 0) - (a.views || 0);
    return a.ts - b.ts;
  });
  list.replaceChildren(...arr.map(p => document.querySelector(`.card[data-id="${p.id}"]`)).filter(Boolean));
  applyFilter();
});

$('#autofill').addEventListener('click', () => {
  const pending = POSTS.filter(p => scoreOf(p.id) === null);
  if (!pending.length) { toast('没有未评分的帖子了'); return; }
  const v = p => Number(p.views) || 0;
  const n5 = pending.filter(p => v(p) > 10000).length;
  const n4 = pending.filter(p => v(p) > 1000 && v(p) <= 10000).length;
  const n1 = pending.length - n5 - n4;
  if (!confirm(`给剩下 ${pending.length} 条按展示补分？\n\n>10000 → 5 分：${n5} 条\n1000–10000 → 4 分：${n4} 条\n≤1000 → 1 分：${n1} 条`)) return;
  pending.forEach(p => { st[p.id] = v(p) > 10000 ? 5 : (v(p) > 1000 ? 4 : 1); });
  save();
  document.querySelectorAll('.card').forEach(c => c.refresh && c.refresh());
  applyFilter();
  toast(`已补 ${pending.length} 条`);
});

const rowsForSave = () => POSTS.filter(p => scoreOf(p.id) !== null).map(p => ({ id: p.id, score: scoreOf(p.id) }));

// 只有 site/serve.py 提供 POST /save；静态托管（Cloudflare Pages）上隐藏，避免点了报 404
if (!['127.0.0.1', 'localhost'].includes(location.hostname)) $('#save').hidden = true;
$('#save').addEventListener('click', async () => {
  const rows = rowsForSave();
  if (!rows.length) { toast('还没有评分', true); return; }
  try {
    const r = await fetch('/save?name=target-ratings.json', { method: 'POST', body: JSON.stringify(rows) });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    toast(`已写入 ${j.saved}（${j.rows} 条）`);
  } catch (e) {
    toast('保存失败：服务没开写入口，请用「导出评分」', true);
  }
});

$('#export').addEventListener('click', () => {
  const out = POSTS.filter(p => scoreOf(p.id) !== null).map(p => ({ id: p.id, score: scoreOf(p.id) }));
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'target-ratings.json'; a.click();
  URL.revokeObjectURL(a.href);
  toast(`已导出 ${out.length} 条`);
});

$('#import').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async () => {
  const f = $('#file').files[0]; if (!f) return;
  try {
    const rows = JSON.parse(await f.text());
    rows.forEach(r => { if (r && r.id && typeof r.score === 'number') st[r.id] = r.score; });
    save(); await pushState(); toast(`已导入 ${rows.length} 条`); setTimeout(() => location.reload(), 500);
  } catch (e) { toast('导入失败：不是合法 JSON', true); }
});

$('#reset').addEventListener('click', async () => {
  if (!confirm('清空所有评分？线上记录也会清空。')) return;
  localStorage.removeItem(KEY);
  try {
    const r = await fetch(SYNC, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ratings: {}, replace: true }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  } catch (e) {
    toast('线上评分没清掉，下次打开会回来', true);
  }
  location.reload();
});
</script>
</body>
</html>
